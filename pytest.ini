# 固定 importlib 导入模式。
#
# 为什么必须固定：仓库里多张卡都有同名 test_adapter.py 与同名 _common.py，
# 默认 prepend 模式按目录名导入，同名文件会互相覆盖，表现为
# 「单独跑通过、全仓跑收集错误」。这类错最容易被误判成 flaky。
#
# 注意：pytest 的 ini 里没有 importmode 这个键（写了也不生效，
# 只会报 Unknown config option）。必须用 addopts 传 --import-mode。
#
# 同时：不要把 tests 目录改成包（加 __init__.py）。实测那样会把
# 收集错误从 4 个放大到 21 个，且 unittest discover 会继续空跑。

[pytest]
testpaths = Plugins/ops
addopts = --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
