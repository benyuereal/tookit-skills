# ── tier 语义（卡片 impls[].tier，不是本文件的字段，但常被误读）──
#   primary     首选实现
#   structural  特殊形状的结构性选择
#   reference   只用于读算法，不作为性能候选
#   fallback    查表/条件未命中时的退路
#   avoid       **反模式**：表达「别这么做」，**不是实现候选**
#               ⇒ 对 avoid 条目要求「换成现成库」是范畴错误（2026-11-22 实际发生过）
#               ⇒ avoid 条目应写清「为什么这条路不成立」，不需要有库实现
#   unavailable 本平台不支持

# 从环境移除的库（曾出现在卡片里，实际不可导入或不存在）
removed:
  - canonical_id: hipblaslt
    reason: "import hipblaslt 失败；torch 侧的 hipBLASLt 是 torch 内部后端，不是独立可调库"
    replaced_by: triton
  - canonical_id: tilekernels
    reason: "不是可导入包（TileKernels 是按模型层组织的 tilelang 算子集合，不是库）"
    replaced_by: tilelang
