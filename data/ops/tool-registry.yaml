# ===== playbooks：按顺序的工具链 =====
# 规则：chain 里的每个 id 必须在上面的 tools 里存在（gen --check 会验）。
playbooks:
  - id: correctness-failure
    when: 正确性门不过（max_abs 超容差 / cosine 掉 / bit_exact 不成立）
    chain:
      - numeric_ulp
      - nan_inf_scan
      - dmesg
      - builtin_readelf_nm
      - hipgdb
    why: 先定位数值本身（差几个 ULP、有无 NaN/Inf），再排除驱动报错，然后看符号/地址，最后才上调试器。顺序反了会花几小时在调试器里找一个 ULP 的问题。
  - id: perf-below-target
    when: 正确性过了但 remaining 大、或比基线慢
    chain:
      - hy_smi
      - flock
      - hipprof_pmc_csv
      - counter_probe
      - inspect_so
      - time_align
    why: 先确认卡没被别人占（否则数据全废），再采 PMC，用 counter_probe 确认要用的计数器真的存在，然后用 inspect_so 定驻留档，最后时间对齐把计数器归到具体调用。
  - id: crash-or-hang
    when: 崩、挂、或结果随机不可复现
    chain:
      - dmesg
      - gpu_reset
      - bounds_check
      - hipgdb
      - builtin_readelf_nm
    why: 先看是不是掉卡（dmesg/gpu_reset），再查越界（sanitizer），然后才用 hipgdb 看栈。跳过 dmesg 会把「掉卡」误诊成「kernel 写错」。
  - id: not-reproducible
    when: 同一份代码两次跑结果不同，或换机器结论变了
    chain:
      - hy_smi
      - driver_version
      - hipcc_dumpversion
      - hipconfig
      - bw_calibrate
      - compute_peak
    why: 先锁时钟（sclk 档位不一致是最常见原因），再钉死版本三件套，最后确认分母有没有漂（带宽/算力峰值都要重标定）。
