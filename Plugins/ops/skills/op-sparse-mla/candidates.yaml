  - id: aicc_mllvm_compile
    direction: bypass-tilelang-codegen
    status: verified
    priority: 1
    hypothesis: "手写 HIP kernel 必须用 aicc + **完整镜像对标 tilelang kernel 的编译 flag**（含 pass_configs 条件项）；hipcc 不行（不是慢，是拒收）"
    why: "这批 flag 是 tilelang JIT 在本机（aicc 在 PATH 时）实际编译 kernel 用的那套，本 kernel 少一套就慢 ~1.12×/CTA（A/B 实测）；hipcc（后端 dcc/lld）对这批 -mllvm 项报 Unknown command line argument，必须直接调 aicc（/opt/dtk/bin/aicc）。flag 本质是给后端 LLVM 做指令调度/延迟建模/寄存器预算（mmac 延迟、LDS 延迟、768 VGPR 预算、waitcnt 时机），不改变数值（实测位级一致）。**2026-10-29 GLM 档追加：flag 列表不止 10 个无条件项——get_hcu_compile_flags 还有 pass_configs 条件项（TL_ENABLE_FAST_MATH → -mllvm=-enable-hcu-approx-func-fp-math，hcu.py:271），sparse_mla_fwd 的 @tilelang.jit 开了 FAST_MATH。首版手写构建只抄 10 个无条件项，慢 1.16×/CTA（GLM S=128/320k 0.952 vs 0.810 ms，两版输出位级一致）——规则：镜像对标 kernel 的 pass_configs，不是抄静态 flag 列表**"
    expect: "位级一致 + 相对 hipcc/无 flag 路径快 ~1.12×/CTA；漏条件 flag 再多慢 ~1.16×/CTA"
    evidence: "aicc vs hipcc 两版 .so A/B；4 变体同进程 A/B（GLM 档）；机器码对照 .text 11276B(漏 flag) vs 10960B(tilelang 同体)，BW1100 gfx938；flag 出处 tilelang/contrib/hcu.py get_hcu_compile_flags()（compiler != aicc 时 early-return []，即 aicc 才生效）"
    source: "dev/COMPILE.md 与 dev/sparse_mla_hip_glm.hip 头注释「编译」段（完整命令）；op-hip-compile/derive_flags.py（可直接复算）；<tilelang-hygon>/tilelang/contrib/hcu.py get_hcu_compiler()/get_hcu_compile_flags()；perf/sparse_mla/sparse_mla_fwd.py @tilelang.jit(pass_configs=...)"
    verified_on: "2026-10-29 / BW1100 gfx938 / DTK 6.3.26113"
    note: "完整命令见 SKILL.md §六「手写 HIP 交付物」；少任何一个 -mllvm 项都算复现失败（含条件项）"

