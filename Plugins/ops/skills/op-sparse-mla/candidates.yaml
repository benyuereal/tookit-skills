# 稀疏 MLA 前向 —— 方向预算 + 候选队列 + 已判死清单（loop.py 读写）
#
# 纪律：
#   - directions 是**攻击面**（一类候选）。同一方向证伪 MAX_DIRECTION_REFUTES=2 次 ⇒ 封方向，
#     loop.py 拒绝再受理该方向的任何候选，回 op-constrain 重定约束。
#   - candidates 里只放「还值得跑」的；必须声明 direction，否则「2 次封方向」保护不到它，
#     loop.py run 直接拒绝。跑完由 loop.py run 记录判定，采纳后 status=adopted。
#   - **done_when（可选，一条 shell 命令）是完成判定的唯一裁决点**：status=adopted **必须**
#     带它。`python3 loop.py -C <本卡> verify --tag <id>` 执行该命令，**只有返回 0 才把
#     status 改成 adopted**；否则保持原状态并回显输出尾部 20 行。模型说「跑完了/到顶了」
#     不算数。命令在**仓库根**执行（$OPS_CARD 指向本卡目录），例：
#       done_when: 'python3 -I scripts/opcheck.py correctness --contract "$OPS_CARD/contract.yaml" --shape decode-glm53 --variants hip-glm'
#     写不出可复跑的命令 ⇒ 这条候选就还不能算完成（状态别写 adopted）。
#   - refuted 是**已判死**的唯一落点，**why 必须写机制**，不能只写「试过，慢」。
#     机制才能迁移到下一个算子；结论不能。kind: impl（实现判死）/ direction（方向证伪）/
#     claim（早期的诊断类结论，不是候选）；老条目没有 kind，按 impl 读。
#
# ledger.md §三 是**证据叙述**（原始数值、日志路径、我推翻我自己的记录），不参与判定；
# 只在 ledger 里存在的结论，loop.py 拦不住，等于没有。
#
# 本卡不再提供 tag 级文本变体实验适配器（bench/ab.py / bench/acc_probe.py / bench/variants.py
# 已移除：15 个变体的结论在下面 refuted 里，生成器本身由 LLM 按需现写）。因此 loop.py 的
# run 子命令对本卡**不可用**；status / queue 照常。要验证新候选，直接跑
#   python3 bench/bench.py --shape <档> --variants <已注册变体> [--mode workset]
#   python3 <repo>/scripts/opcheck.py correctness --contract contract.yaml --shape <档> --variants ...
# 再把结论写回本文件（refuted 或 candidates）。

