# MoE W8A8 融合 —— 方向预算 + 候选队列 + 已判死清单（loop.py 读写）
#
# 本卡的攻击面优先序由 scenarios.yaml 的 moe-low-active 场景决定：
#   table-miss → layout-pack → occupancy
# 理由：MoE 的性能几乎完全由 (量化格式 × gfx) 查表命中决定；
# 未命中时先别改 kernel。

defaults:
  s: 0
  shape: decode-m32
  rounds: 5

directions:
  - id: table-miss
    statement: "该 (量化格式 × gfx) 组合是否落在调优表里；未命中是最大收益"
    status: open
    refutes: 0

  - id: layout-pack
    statement: "权重 layout（HIPC / W6 / marlin）与 kernel 期望是否一致"
    status: open
    refutes: 0

  - id: fusion-boundary
    statement: "epilogue 融 moe_sum 是否划算（已知有慢 2.5-3× 的反例）"
    status: open
    refutes: 0

  - id: batch-independence
    statement: "ASM mode>=1000 在混合专家 batch 下串读——不变量层面的否证"
    status: open
    refutes: 0

candidates:
  - id: check-solution-type
    direction: table-miss
    status: pending
    priority: 1
    action_class: reduce-bytes
    expect: "先确认命中，再谈优化"
    note: "打印 get_aiter_moe_config 的 solution_type；若未命中，改 kernel 是白费的"

  - id: verify-prepack-layout
    direction: layout-pack
    status: pending
    priority: 2
    action_class: improve-locality
    expect: "确认 prepack 的 layout 与 kernel 期望一致"
    note: "aiter_moe_shfl_weight 漏调是静默算错——会表现为精度问题而非性能问题"

  - id: avoid-asm-mode-1000
    direction: batch-independence
    status: pending
    priority: 3
    action_class: reduce-flops
    note: "本条是**否证型候选**：验证 mode>=1000 在混合专家 batch 下确实串读，据此封死这条路"

refuted:
  - id: fuse-moe-sum-epilogue
    kind: impl
    direction: fusion-boundary
    mechanism: >
      融合把本可并行的 moe_sum 串进 grouped GEMM 的依赖链，并多占 smem；
      对本卡这种已经有 4 段的流水线，多一段融合反而减少了 CTA 驻留。
    why: "实测慢 2.5-3×（libraries.md §3 记录的反例）"
    source: "libraries.md §3 与 op-moe-w8a8/SKILL.md 的融合判据"

  - id: asm-mode-ge-1000
    kind: direction
    direction: batch-independence
    mechanism: >
      该 kernel 在混合专家 batch 下会串读其他 token/专家的数据，
      违反 contract.yaml 的 batch_independence 不变量。
      不是性能问题，是正确性问题。
    why: "违反 batch_independence 不变量；安全区是 mode 500-525"
    source: "op-moe-w8a8/SKILL.md 的已知 bug 记录"
