# op-moe-align-permute 变体矩阵。

variants:
  - name: ref-heavy
    source: "本卡 _common.py 的纯 torch 参考（显式算 counts/offsets/slot_map）"
    status: reference
    applies_to: [tiny, decode-m32, prefill-8k, align-64]
    constraints:
      - "只用于正确性对照，不是性能候选"
    mutates_inputs: false

  - name: lightop-align
    source: "lightop 的 align_block_size + permute"
    status: primary
    applies_to: [decode-m32, prefill-8k, align-64]
    constraints:
      - "padding 只支持队尾；前置会静默算错"
      - "align 倍数必须与下游 kernel 的 tile 高度匹配"
    mutates_inputs: false

  - name: aiter-permute
    source: "aiter-das 的 token permute 支撑算子"
    status: fallback
    applies_to: [decode-m32, prefill-8k]
    constraints:
      - "查表命中才可用"
    mutates_inputs: false
