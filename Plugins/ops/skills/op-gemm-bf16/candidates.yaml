# op-gemm-bf16 候选实现
#
# **状态：有 2 个能跑的变体（ref-fp32 / torch-mm），但都不是竞品。**

- id: ref-fp32
  what: torch fp32 的 A@B
  status: done
  why: 正确性锚点。fp32 精度，**不是竞品**，不能用来算 B 项。

- id: torch-mm
  what: torch.mm（bf16 输入，走 hipBLASLt 后端）
  status: done
  why: |
    这是**框架默认路径**，多数场景下就是最优解。
    但它不是「厂商库」的最优形态 —— 它取决于 hipBLASLt 的启发式选择。

- id: hipblaslt-tuned
  what: 直接调 hipBLASLt 并扫参数（而非走 torch 的默认启发式）
  status: todo
  why: |
    **这才是本卡真正该做的对比。** torch.mm 走的是 hipBLASLt 的默认
    启发式，手工扫 `layout` / `algo` 可能再快 5-15%。
    历史记录里 hipBLASLt 达 498.5 TF（gemm-fp8 卡），但 bf16 没测过。

- id: lightop-gemm
  what: lightop.gemm
  status: blocked
  known_issue: |
    **2026-11-26 实测：M >= 24 时结果错误，与 K 无关。**

      M=8    K=512 N=512   误差 0.002249  合格
      M=16   K=512 N=512   误差 0.002160  合格
      M=24   K=512 N=512   误差 1.064266  **完全错**
      M=32   K=512 N=512   误差 4.475079  **完全错**

    入参约定也踩过：它吃 (A[M,K], B[N,K])，不是 (A, B[K,N])。

    **一次误判值得记**：第一次测到 K=4096 错、K=256 对，
    就归因成「K>256 有问题」，还写进了卡片。
    后来控制 M 不变扫 K，发现 K=256 且 N=4096 时也是错的 ——
    真正的变量是 M，之前的结论是没控制变量的产物。

    护栏已改为按 M 判定：M>=24 直接抛异常。

    root cause 未查（大概是 tile 分块假设了 M<=16 的 warp 布局）。
  why: |
    另有一个反向教训：第一次测（传参错误时）跑出「快 9.3 倍」，
    差点当成重大发现。**没验正确性的性能数字一文不值。**

    实测可用域（M<=16）内性能：tiny 形状比 torch.mm 慢 19%。
    即使用对，也没有优势。

- id: deepgemm
  what: deepgemm-das 的 bf16 路径
  status: blocked
  blocker: 仓库已 clone（/workspace/deepgemm-das），但未构建。

