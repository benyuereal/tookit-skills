# op-gemm-bf16 候选实现
#
# **状态：有 2 个能跑的变体（ref-fp32 / torch-mm），但都不是竞品。**

- id: ref-fp32
  what: torch fp32 的 A@B
  status: done
  why: 正确性锚点。fp32 精度，**不是竞品**，不能用来算 B 项。

- id: torch-mm
  what: torch.mm（bf16 输入，走 hipBLASLt 后端）
  status: done
  why: |
    这是**框架默认路径**，多数场景下就是最优解。
    但它不是「厂商库」的最优形态 —— 它取决于 hipBLASLt 的启发式选择。

- id: hipblaslt-tuned
  what: 直接调 hipBLASLt 并扫参数（而非走 torch 的默认启发式）
  status: todo
  why: |
    **这才是本卡真正该做的对比。** torch.mm 走的是 hipBLASLt 的默认
    启发式，手工扫 `layout` / `algo` 可能再快 5-15%。
    历史记录里 hipBLASLt 达 498.5 TF（gemm-fp8 卡），但 bf16 没测过。

- id: lightop-gemm
  what: lightop.gemm
  status: blocked
  known_issue: |
    **2026-11-26 实测：K > 256 时结果错误。**
      K=256  (tiny)        误差 0.001574  合格
      K=4096 (decode-m32)  误差 1.000000  **完全错**
      K=4096 (prefill-8k)  误差 1.000000  **完全错**

    入参约定也踩过：它吃 (A[M,K], B[N,K])，不是 (A, B[K,N])。
    传错时误差 1.36，转置后 tiny 才合格。

    adapter 里已加护栏：K>256 直接抛异常，**不返回错误结果**。
    悄悄算错比报错危险得多。

    root cause 未查（是 lightop 的 bug 还是我们用法不对，未知）。
    在查清前这个候选不可用。
  why: |
    另有一个反向教训：第一次测（传参错误时）跑出「快 9.3 倍」，
    差点当成重大发现。**没验正确性的性能数字一文不值。**

- id: deepgemm
  what: deepgemm-das 的 bf16 路径
  status: blocked
  blocker: 仓库已 clone（/workspace/deepgemm-das），但未构建。

