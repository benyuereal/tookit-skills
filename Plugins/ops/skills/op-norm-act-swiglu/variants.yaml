variants:
- name: ref-heavy
  source: 本卡 _common.py 的 fp32 参考
  status: reference
  role: correctness_only
  applies_to:
  - s0
  semantics:
    inputs:
    - x
    - residual
    - weight
    outputs:
    - out
    mutates: []
    traffic_passes: 3
    note: fp32 参考，只用于正确性对照，不是性能候选
  note: '**不得用于性能对比**：未优化的参考实现'
- name: two-step
  source: lightop.fused_add_rms_norm + lightop.fuse_silu_and_mul
  status: candidate
  role: competitor
  measured: 0.3050 ms / 369.1 MB / 1234 GB/s（两步法，中间张量 h 落 HBM）
  applies_to:
  - s0
  constraints:
  - '**原地改写 x 与 residual**：多变体对比必须各喂副本'
  mutates_inputs: true
  semantics:
    inputs:
    - x
    - residual
    - weight
    outputs:
    - out
    mutates:
    - x
    - residual
    traffic_passes: 8
    note: ①读x,r 写x,r（4趟）②读h 写out（1.5趟）⇒ 5.5H
- name: fused-hip-mr2
  source: kernels/norm_act_swiglu_mr.hip (BLOCK_ROWS=2)
  status: candidate
  role: best_known
  measured: 0.1496 ms / 167.8 MB / 1124 GB/s（2.03x vs two-step，1.00 ULP）
  applies_to:
  - s0
  constraints:
  - H 必须 = 4096（THREADS*8 == I 的前提）
  - (x+r) 必须留寄存器，不落 LDS —— 这是收益来源
  - BLOCK_ROWS=2 是实测最优（4 行因 vgpr=84 退化）
  - VEC/THREADS/BLOCK_ROWS 必须编译期固化
  mutates_inputs: false
  semantics:
    inputs:
    - x
    - residual
    - weight
    outputs:
    - out
    mutates: []
    traffic_passes: 3
    note: 读x+读r+读w+写out(半宽) = 2.5H；中间张量不落 HBM
