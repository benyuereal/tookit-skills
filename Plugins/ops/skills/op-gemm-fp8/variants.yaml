variants:
- name: hipblaslt
  source: torch._scaled_mm → hipBLASLt
  status: unavailable
  applies_to: []
  constraints:
  - '**实测错误原文**：`torch._scaled_mm` → RuntimeError: could not find valid hipblaslt solution'
  - 注意：这句说明**确实调到了 hipBLASLt**，只是没有 fp8 的解。bf16 路径正常（torch.mm 214 TF）
  - torch.backends.hipblaslt 为 False；ldconfig 无 libhipblaslt
  mutates_inputs: false
- name: tilelang
  source: TileLang DSL（示例 gemm_fp8）
  status: unimplemented
  applies_to:
  - decode-m32
  - prefill-8k
  constraints:
  - DSL 可用，但 gemm_fp8 需现写；本轮未实现
  mutates_inputs: false
- name: tilelang-rs
  source: TileLang reshuffle 变体
  status: unevaluated
  applies_to:
  - prefill-8k
  constraints:
  - 需要 preshuffle 预处理，多一份布局转换
  mutates_inputs: false
- name: aiter
  source: aiter-das GEMM 入口
  status: primary
  applies_to:
  - decode-m32
  - prefill-8k
  constraints:
  - 查表命中才可用；未命中会降级
  mutates_inputs: false
- name: hand-hip
  source: 手写 HIP + MFMA intrinsic
  status: structural
  applies_to:
  - decode-m32
  constraints:
  - 裸 cvt_pk_fp8_f32 需 fp8-insts，gfx938 不提供；须用 cast_to_f8/cast_from_f8
  - ROCm 上 fp8 是 fnuz 语义（gfx950 除外），不能照搬 NVIDIA e4m3
  mutates_inputs: false
- name: lightop-channelwise-kme
  source: lightop.gemm_ops.native.hipblaslt_w8a8_channelwise_gemm_kme
  status: usable
  applies_to:
  - prefill-8k
  constraints:
  - '**源码断言（照抄，照着传就不会错）**：transpose_flag=="NT"；a/b 均 contiguous；scale_a/scale_b 的 dtype 是 float32；a.shape[-1]==b.shape[-1]（b
    必须是 (N,K) 不是 (K,N)）'
  - '**必须带 _kme 后缀**；不带后缀的报 ValueError: Unsupported input dtype'
  - 调用：ok, out = N.hipblaslt_w8a8_channelwise_gemm_kme(a8,b8,sa,sb,M,N,K,"NT",torch.bfloat16)
  mutates_inputs: false
  measured: 30.4 TF @4096³（4.515 ms），rel=0.037；8192³ 35.4 TF。**比 aiter 慢 30~37%**
- name: lightop-channelwise
  source: lightop.gemm_ops.native.hipblaslt_w8a8_channelwise_gemm（无 _kme）
  status: unusable
  applies_to: []
  constraints:
  - 'ValueError: Unsupported input dtype'
  mutates_inputs: false
- name: lightop-w8a8-gemm
  source: lightop.gemm_ops.native.hipblaslt_w8a8_gemm（plain）
