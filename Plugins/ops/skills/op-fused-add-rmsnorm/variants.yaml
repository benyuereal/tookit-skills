variants:
- name: ref-heavy
  source: 本卡 _common.py 的纯 torch fp32 参考
  library: in-house
  status: reference
  applies_to:
  - tiny
  - decode-m1
  - decode-m32
  - prefill-8k
  constraints:
  - 只用于正确性对照，不是性能候选
  mutates_inputs: false
  role: correctness_only
  note: '**不得用于性能对比**：它是未优化的参考实现，打赢它没有工程意义'
- name: lightop-rmsnormadd
  source: lightop.RMSNormAdd（同族 RMSNormAddDropout / RMSNormAddDropoutBias）
  library: lightop
  version: 0.6.0+dtk2604.torch2110
  status: primary
  applies_to:
  - decode-m1
  - decode-m32
  - prefill-8k
  constraints:
  - 融合残差版本可能原地改写残差，多变体对比须各喂副本
  - eps 在 sqrt 内，与参考实现一致
  mutates_inputs: true
  role: competitor
- name: aiter-norm
  source: aiter 的 norm 族（非融合对照）
  library: aiter
  version: 0.1.6+dtk2604.torch2110
  status: fallback
  applies_to:
  - decode-m1
  - decode-m32
  - prefill-8k
  constraints:
  - 不融合残差，字节数比融合版多一次往返
  mutates_inputs: false
  role: competitor
