# 机器常数（gfx938 / Hygon DCU BW1100 / 69 CU）
#
# 纪律：
#   - 每个常数带 source + verified_on + status。status ∈ measured / derived / unverified。
#   - 两个来源冲突时并列记录，**不取平均、不挑好看的那个**，并在 conflicts 里写清影响。
#   - 这里只放物理常数与可由常数推出的量；具体形状的绝对耗时进 kb/op-opt/。

chip:
  name: gfx938
  product: Hygon DCU BW1100
  verified_on: 2026-10-27

compute:
  cu_count:
    value: 64
    status: measured
    verified_on: 2026-11-13
    source: "torch.cuda.get_device_properties(0).multi_processor_count = 64；hbird-gemm README 亦写 64 CU；pmc 从 dmesg SE 位图数出 64。三方一致。
    caveat 2026-11-13 更正：原值 69 来源写作「rocminfo / hy-smi」，但本机 rocminfo 只枚举到 CPU agent、hy-smi 的逐卡读数 69/70/71 与三方不符 —— 该 69 使所有按 CU 归一的量（per-CU 摊销、rounds、MFMA/CU）偏 ~8%。
    gfx938 实测；其他 gfx 的 CU 数不同，换设备必须重测。"
  wave_size:
    value: 64
    status: measured
    source: "AMD GCN 系谱，gfx938 一致"
  vgpr_per_cu:
    value: 65536
    unit: "32-bit 寄存器"
    status: measured
    source: "64 KB VGPR 文件 / CU"
  vgpr_per_thread_cap:
    value: 256
    unit: "32-bit 寄存器"
    status: derived
    source: "ISA 单线程上限"
  sdpr_per_thread_cap: 102
  lds_per_cu:
    value: 64
    unit: KB
    status: measured
  mma_bf16:
    shape: [16, 16, 16]
    flops: 8192
    status: measured
  # ---- 算力分母的三层口径（2026-11-23 立规矩）----------------------------
  # 混用三类数是本仓库最贵的一类错误。三者语义完全不同，不可互相顶替：
  #   nominal     : 芯片规格/厂商给出的硬件名义峰值。**不可复跑**（来自规格书），
  #                 只能当「上限」引用，不能当达成率分母。
  #   achievable  : 本机某个**高质量实现**实测到的值。可复跑。当「还有多少空间」的分母。
  #   impl_measured: 某一条具体实现的实测值。可复跑。只代表那条实现，不外推到硬件。
  # 判定规则：报「达成率」用 achievable；报「这条实现多快」用 impl_measured；
  #          报「离硬件上限多远」用 nominal，并同时给出前两者。
  #
  # 纪律：impl_measured 类的数**不许外推为硬件上限**。
  # 2026-11-23 事故：aiter opus 49.8 TF（impl_measured）被当成 fp8 上限，
  # 推出「11 倍空间」；实际 torch._scaled_mm 498.5 TF（89%），空间只有 1.12 倍。
  # 一条 impl_measured 数据要成为 achievable，必须至少两个不同实现互相印证。
  bf16_gemm_peak_tf:
    value: 279
    caliber: achievable
    unit: TFLOPS
    status: measured
    at_sclk_mhz: 1350
    saturation: "已打满"
    saturation_pct: 99.7
    verified_on: 2026-11-23
    source: >
      本机 hipBLASLt 大 GEMM（N=6144）10 轮独立采样的峰值中位数 = 279 TF
      （单轮样本 270/270/271/274/276/282/283/286/295/306，极差 13%）。
      fp16 独立路径同形状 309 TF，同量级。
      sclk 全程 1350 MHz（hy-smi 档位 8，测量期间轮询确认未变动）。
    reproduce: Plugins/ops/skills/op-roofline/tools/calibrate_bf16_peak.py
    note: >
      **报 bf16 达成率用这个值**（achievable 口径）。
      与 fp8 标称 560 的 2:1 关系自洽：279/280 = 99.7%。
      稳态（median 耗时）只有 273 TF，持续加热 20 s 后掉到 243 TF——
      报「持续跑能到多少」不要用峰值。
    measurement_lesson: >
      caveat 2026-11-23 第二次更正（同一天内）：先前写 310 TF 是**单轮 11 次采样的偶然高值**。
      改成 10 轮独立采样取峰值中位数后是 279。差 11% 足以让 bf16 峰值
      「超过」由 fp8 标称推出的理论值 280，制造出一个假矛盾。
      **教训：峰值标定必须多轮独立采样取中位数，单轮 min 会把偶发高值当峰值。**
    vs_nominal: >
      fp8 标称 560 TF 是业主确认的口径；按本机实测的同库 fp8/bf16 = 1.98×
      确认是 2:1 双速率，故 bf16 标称 = 280 TF。
      本机 hipBLASLt 实测 279 TF = 99.7% —— bf16 是成熟实现，已打满。
  mma_issue_peak:
    value: 25.2
    unit: "条 MFMA(16x16x16 bf16)/cycle（全 GPU）"
    status: derived
    verified_on: 2026-11-23
    source: >
      由上面的实测峰值反解：279 TF / (8192 flop × 1350 MHz) = 25.2 条/cycle，
      即 0.39 条/CU/cycle（64 CU）。
    note: >
      用来判「谁被算力卡住」；单算子占用率 80%+ 才算。本项目稀疏 MLA 只有 11~24%。
    history: >
      caveat 2026-11-23 更正：旧值 19.7 条/cycle（声称由「2048^3 实测 217 TF ≈ 88% 峰值」反推）
      是错的。两个毛病：①2048³ 只有 0.097 ms，固定开销占比大，根本不能代表峰值；
      ②按 19.7 反推的峰值 185 TF **低于同机实测的 310 TF**——实测超过声称的峰值，
      说明常数错而不是测量错。后果是所有 bf16 算力达成率被高估 ~1.7×
      （例：MoE grouped GEMM 原本记 0.43，实际 0.26）。
  clock_ghz:
    value: 1.15
    unit: GHz
    status: measured
    source: "hy-smi 读生产卡 6-9 实际运行档位"
    note: "卡 0-5 钉在 600 MHz。**跨卡比较只能用比值，不能用绝对 µs**。"
    verified_on: 2026-10-27
  nominal_peak_tf:
    value: 560
    caliber: nominal
    precision: fp8              # ← 业主确认：560 是 fp8 口径
    unit: TFLOPS
    status: unverified          # 来自芯片规格/业主确认，本仓库无法复跑
    verified_on: 2026-11-23
    source: >
      业主确认：gfx938 的 560 TF 是 **fp8** 口径的峰值算力。
      nominal 来自芯片规格，本仓库无法复跑——按口径规则，nominal 不要求 reproduce。
    note: >
      **gfx938 是 2:1 双速率**：fp8 是 bf16 的 2 倍。
      证据（同库同形状对照，唯一能判双速率的测法）：
        aiter.gemm_a8w8_opus (fp8)  vs  aiter.gemm_a16w16_opus (bf16)
        N=6144: 9.7336 ms vs 19.2342 ms → 算力比 1.98×
      这条必须记牢：它直接决定所有 mixed precision 判断。
      ⇒ bf16 nominal = 560/2 = 280 TF；实测 279 TF = **99.7%，已打满**。
      ⇒ 用 bf16 的分母（279）去算 fp8 的达成率会错 2 倍，反之亦然。
    fp8_nominal_tf: 560
    bf16_nominal_tf: 280

  # ---- fp8 三层峰值表（2026-11-23 修订；对应 PANORAMA §4.1）---------------
  # 三层口径（与 compute 段开头一致）：
  #   nominal     = 560 TF   —— 业主确认的规格口径（见上面的 nominal_peak_tf）
  #   achievable  = 579.7 TF —— hipBLASLt 手工扫参 8192³ = 103.5% 名义
  #   isa_ceiling = 686.5 TF —— 16×16×32 最宽 fp8 mmac 的理论天花板
  # **achievable > nominal 不是矛盾，是规格书保守。achievable 才是达成率分母。**
  #
  # 为什么另两层不是顶层 TFLOPS 常数：
  #   test_peak_constant.py 的 reproduce 契约要求「顶层 unit=TFLOPS 且
  #   caliber∈{achievable,impl_measured}」的常数必须有仓内可跑的复跑脚本。
  #   579.7 来自外部项目 hbird-gemm（本仓无扫参脚本；hipblaslt-bench 无执行位），
  #   诚实结论只能是 unverified。作为**对照表条目**登记，可以完整写 caliber +
  #   confidence + source，同时不伪造复跑脚本、不改 unit 骗过门禁。
  #   下游引用时按 caliber 筛：达成率分母取 achievable，理论距离取 isa_ceiling。
  fp8_peak_layers:
    nominal_tf: 560
    achievable_tf: 579.7
    isa_ceiling_tf: 686.5
    achievable:
      value: 579.7
      caliber: achievable
      unit: TFLOPS
      status: unverified       # 本仓不可复跑：来源在外部项目；hipblaslt-bench 无执行位
      confidence: unverified
      verified_on: 2026-11-23
      source: >
        PANORAMA v2（2026-11-23）§4.1，转引 hbird-gemm/docs/perf.md §3：
        hipBLASLt fp8 8192³ = 579.7 TF（= 560 名义的 103.5%）。
      verification_note: >
        本机实测可达（2026-11-23，torch._scaled_mm 走 hipBLASLt 后端）：
          8192³ = 2205.7 µs = 498.5 TF（89.0% of nominal 560）
          4096³ =  300.3 µs = 457.6 TF（81.7%）
        rel_l2 vs fp32 dequant matmul = 0.0017（数值正确）
        复跑：python3 -I /tmp/verify_fp8_claim.py
        PANORAMA 记录的 579.7 TF 来自 hbird-gemm/docs/perf.md §3（hipBLASLt 手工扫参），
        比本机框架默认调用高 16%，差异来自 solution 枚举（见 STANDARDS 的 GEMM 三陷阱）。
        ⇒ achievable 用 579.7（扫参可达），仅当 benchmark 也做过扫参时才对齐；
          框架默认调用的下限是 498.5。
      note: >
        用 579.7 的前提：被比较的 benchmark **也做过 solution 扫参**；
        若对方是框架默认调用（torch._scaled_mm 未枚举），分母改用 498.5 才公平。
    isa_ceiling:
      value: 686.5
      caliber: nominal         # ISA 最宽 fp8 mmac 推出的理论天花板，非本机实测
      unit: TFLOPS
      status: derived
      verified_on: 2026-11-23
      source: >
        PANORAMA §4.1：16×16×32 最宽 fp8 mmac 的 ISA ceiling = 686.5 TF。
        与 op-hip-compile/references/isa-census.md 的
        `v_mmac_f32_16x16x32_fp8_fp8`（fp8 主力，宽度 32 = bf16 的 2 倍）同源。
      note: >
        理论天花板，不是可达值：报达成率不要用它当分母（用 achievable 579.7）。
        它只回答「离硬件理论极限还有多远」。

  fp8_impl_measured_tf:
    value: 49.8
    caliber: impl_measured
    unit: TFLOPS
    status: measured
    verified_on: 2026-11-23
    source: >
      本机 aiter.gemm_a8w8_opus（gfx938 opus kernel）实测 49.8 TF（4096³），
      六形状 47.8~49.7 TF 收敛。这只是**这一条实现**的值。
    reproduce: Plugins/ops/skills/op-optimize/cases/010-fp8-gemm-ceiling/bench.py
    note: >
      **这个数只代表 aiter 的 opus 实现族，不代表硬件 fp8 上限。**
      同库的 bf16（gemm_a16w16_opus）只有 24.7 TF，比 hipBLASLt 的 310 TF 慢 8.8×
      —— 说明 opus 这一族实现整体慢，49.8 是被这一族拖下来的，不是 fp8 的天花板。
    history: >
      caveat 2026-11-23 两次更正，值得完整记录：
      ① 旧值 540 TF（"实测 479 TF = 89% 达成反推"）来源是 kb 的一条记录，
         **无复跑脚本**，从未被本仓探针验证。这个质疑成立。
      ② 但我第一次的修法把 540 改成 49.8 并声称「这是 fp8 峰值」——**方向相反且更危险**。
         49.8 是 impl_measured，被我当成了 achievable/硬件上限。后果是把
         「还有约 11 倍空间」判成「几乎没有空间」，会让人放弃优化。
      ③ 我自己数据里就有反证没往下走：fp8 若比 bf16 慢 5.3×，原生 fp8 不可能如此。
         正确读法是「本机 fp8 那条实现慢」，不是「fp8 硬件不行」。

  fp8_native_speedup:
    value: 2.0
    caliber: achievable
    unit: "倍（fp8 相对同库同形状 bf16 的耗时倒数）"
    status: measured
    verified_on: 2026-11-23
    source: >
      同库同形状对照（这是唯一能判「原生 fp8 vs dequant 回退」的测法）：
        aiter.gemm_a8w8_opus  vs  aiter.gemm_a16w16_opus
        4096³: 0.4616/2.9034 ms → 耗时比 0.523 ⇒ fp8 快 1.91×
        2048³: 0.7315/0.4616 ms → 耗时比 0.631 ⇒ fp8 快 1.58×
      耗时比 ≈0.5 说明是**原生 fp8 MMA**（2× 吞吐）；
      若是 dequant 回退，两边都跑 bf16 MMA，比值应 ≈1.0。
    reproduce: Plugins/ops/skills/op-optimize/cases/010-fp8-gemm-ceiling/bench.py
    note: >
      **本机有原生 fp8 路径**，不是 dequant 回退。这条是上面那个误判的直接否证。
      但「有原生路径」不等于「有高质量实现」——aiter opus 族整体慢（bf16 也只有 24.7 TF），
      所以 fp8 在这条实现上只有 49.8 TF。
    caveat: >
      判「是否原生 fp8」必须**同库同形状**对照。
      跨库比较（aiter fp8 对 hipBLASLt bf16）会把库的差距记成精度的差距——
      这就是 2026-11-23 那次误判的根因。

launch:
  # 单次 kernel launch 的固定代价。任何「融合能省多少」的估算都以它为上限基数：
  # N 个串行小 kernel 的理论下限就是 N × launch。
  floor_us:
    value: 43
    unit: µs
    status: measured
    verified_on: 2026-11-23
    source: >
      空 kernel（单元素 add_，CUDA event 计时，13 次中位）实测 43.2 µs。
      同环境 topk 算子（B=8 L=8192）0.0334 ms = 0.77× 该值，
      说明它已完全被 launch 开销主导。见 cases/009-topk-block-index。
    note: >
      这个数是「小 kernel 的耗时下限」，不是「launch 的税」。
      判一个小算子值不值得优化，先看它离这个地板多远：
      ≈1 就没有空间；≫1 才值得看。别拿带宽达成率套在 MB 级的数据上。

memory:
  l2_size:
    value: 8
    unit: MB
    status: measured
  ddr_access_granule:
    value: 128
    unit: B
    status: derived
    source: "PMC 记账口径：DRAM 读字节 = (TCC_HIT + TCC_MISS 的 miss 项) × 128B"
  stream_read_peak:
    value: 1870
    unit: GB/s
    status: measured
    caliber: achievable
    at_sclk_mhz: 1350
    verified_on: 2026-11-26
    source: >
      本机实测纯读上限 = **1870 GB/s**（业主 2026-11-26 确认）。
      读数来源：scripts/bw_calibrate.py（2 GB bf16 张量，triton 手写 kernel，
      num_warps × BLOCK 各 16 组扫参取最高，30 次 event 中位，sclk 1350 MHz）。
      同一次标定的其余三档：
        纯读   1870 GB/s
        纯写   1692 GB/s
        1:1    1680 GB/s
        2:1    1730 GB/s
      完整四档见 Plugins/ops/op-atlas/bw-ladder.yaml，复跑同名脚本。
    reproduce: scripts/bw_calibrate.py
    note: >
      **这个键只代表「纯读」一档**。读写比不同必须换档，不可拿 1870 当所有算子的分母：
        R2W2（rmsnorm/layernorm 类）→ 1:1 档 1680
        R2W1（GEMM）              → 2:1 档 1730
        纯写                     → 1692
      历史值 1724（长期被当分母，PANORAMA 标 unverified）已作废，作为记录保留在下面。
    history: >
      2026-11-26 变更：1965 → 1870（业主确认）。1965 是 2026-11-23 那次标定
      读到的，当时三次独立标定读到 1988 / 1946 / 1965，取的是最高值；
      1870 是同口径下的保守值，作为达成率分母更稳妥——拿最高读数当分母
      会系统性低估所有算子的达成率。
      更早的 1724 自 2026-10-27 起被当分母，但本仓两个探针从未复现出它，
      PANORAMA v2 §4.2 亦标「无测量来源」，已作废。
    measured_bandwidth:
      note: >
        四档并列，**不取平均、不挑好看的那个**。读写比不同不可直接互比。
        详细配置（warps/block/tensor_mb）见 op-atlas/bw-ladder.yaml。
      by_mode_gbs:
        read_only: 1870
        write_only: 1692
        rw_1to1: 1680
        rw_2to1: 1730
      superseded:
        value_1965:
          source: "2026-11-23 标定读数（三次 1988/1946/1965 取最高）"
          note: >
            2026-11-26 起不再作为分母。峰值带宽约 1870 GB/s 是更稳妥的口径；
            1965 是同一批数据里的上沿，用它当分母会让达成率整体偏低约 5%。
        value_1724:
          source: "历史值，2026-10-27 起使用，无测量来源"
          readings_gbs:
            copy: 1051
            mul: 1287
            add: 1634
            sum: 865
          note: "bw_calibrate 旧版（torch elementwise，67MB 张量）的读数；无一到 1724"
        panorama_add_1498_1605:
          source: "PANORAMA v2 §4.2（多次实测 add 2R+W）"
          note: "口径与本次 2:1 档 1730 同族，量级一致"

  stream_copy_peak:
    value: 1350
    unit: GB/s
    status: measured
    source: "copy(R+W)，卡 4 1338 / 卡 6 1350"
    note: >
      与 bw_calibrate 的 copy 1051（2026-11-23，sclk 1350）差 ~28%——
      两者口径同为 R+W 但实现不同（旧值来自 torch 大块拷贝）。
      引用 copy 峰值时以同一次标定的数为一组，不要混用。
  spec_bandwidth:
    value: 1100
    unit: GB/s
    status: unverified
    source: "产品型号 BW1100 标称值"
    note: "**不要用它算达成率**。见 conflicts:peak-bw-definition。"

conflicts:
  - id: peak-bw-definition
    severity: high
    claim_a:
      text: "本机峰值带宽 = 1100 GB/s（标称）"
      used_by: ["op-sparse-mla/contract.yaml:floor.peak（2026-10-27 前）", "mqa 优化结论「分离平面 955 GB/s = 87% 峰值」"]
    claim_b:
      text: "本机流式只读实测 = 1724 GB/s"
      used_by: ["op-sparse-mla/contract.yaml（2026-10-27 起）", "mem-only 变体达成率 94~97%"]
      status_note: >
        2026-11-23 复核：1724 本身**无测量来源**（PANORAMA §4.2 亦标 unverified），
        本仓 bw_calibrate（sclk 1350）实测 add 1634 / copy 1051 / mul 1287 / sum 865，
        无一到达 1724。但它仍是当前唯一在用的分母（改动会让全仓 utilization 一起跳），
        故保留 1724 并显式降级为 unverified：引用时须与实测并列双报。
    impact: >
      同一份 955 GB/s 的实测数据：拿 1100 做分母是 87%（接近上限，别做了）；
      拿 1724 做分母是 55%（还有 1.8×）。**分母换了，优化该不该继续的结论就反了。**
    resolution: >
      **仍用 1724 做分母（不擅自改值），但它现在是 unverified。** 标称 1100 明确作废。
      凡是用 1100 算出来的达成率，都要按 1724 重算一遍再引用。
      **新增要求**：1724 未经本仓复跑，凡引用它算出的 utilization，必须与
      memory.stream_read_peak.measured_bandwidth 的实测值并列双报，不许单报。
      待 bw_calibrate 在统一时钟档下复现出稳定值后，再据实替换 1724。
    action:
      - "passed op-sparse-mla/contract.yaml:floor.peak 1100 → 1724（status 改 measured）"
      - "passed op-moe-w8a8/contract.yaml:floor.peak 1100 → 1724（status 改 measured）"
      - "passed op-gemm-fp8/contract.yaml:floor.peak 1100 → 1724（status 改 measured）"
