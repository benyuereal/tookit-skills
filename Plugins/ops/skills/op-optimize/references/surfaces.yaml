# 攻击面预枚举（op-optimize 的候选方向来源）
#
# 为什么有这个文件：candidates.yaml 要求每个候选写 direction，且 direction
# 必须在 directions 段里声明。此前这一步要人/agent **凭空发明**一个方向名——
# 探索期本来就模糊，这是真实的探索成本来源。
# 这个文件把「发明」变成「从表里挑」：挑是廉价的，想是昂贵的。
#
# 纪律：
#   - id 即 direction 的取值。不在本表里的 direction，enumerate 不生成。
#   - 每条必须挂一条 pipeline-laws 的定律（law）。判死时要能追溯到机制，
#     不许写「试过，慢」。
#   - check 必须是一条**可复跑**的探测命令或明确的 PMC 计数器名，
#     不许写「看看是不是瓶颈」这种无法执行的判据。
#   - precondition 写清楚「在什么条件下这条才值得试」。不写条件的攻击面
#     会变成万能借口。

- id: occupancy
  statement: "CTA/CU 驻留数是否被 LDS 或寄存器打到更低档"
  law: L1
  class: residency
  precondition: "已知 tile 形状，且实测 occupancy < 目标档"
  check: "pmc: GRBM_COUNT / SQ_WAVES；hipcc --resource-usage 看 LDS 与 VGPR"
  evidence: "同 body LDS 16→32KB 会把 3 CTA/CU 打到 2，墙钟 +27.5%"
  cost: M

- id: grid-tail
  statement: "grid 是否为 CU 数的整数倍；尾波占比多少"
  law: L1
  class: residency
  precondition: "grid 不是 CU 倍数的整数倍，且 kernel 占总时间 >5%"
  check: "pmc: GRBM_COUNT；对比 grid 与 CU 数取模"
  evidence: "尾波 >10% 时尾块占用整卡却只干 10% 的活"
  cost: S

- id: prefetch-depth
  statement: "预取/流水深度是否真的是延迟杠杆（多半不是）"
  law: L3
  class: pipeline
  precondition: "load-only 消融尚未达到流式读峰值；否则调深度无效"
  check: "python3 -I scripts/probe_stream.py（拿流式峰值）+ load-only 变体计时"
  evidence: "2-stage 双缓冲会把 occupancy 16→8 waves，实测 0.65x"
  cost: S

- id: barrier-width
  statement: "每个 barrier 之间摊了多少工作；barrier 是否过密"
  law: L2
  class: pipeline
  precondition: "PMC 显示同步类指令占 VALU 发射的显著比例"
  check: "pmc: SQ_INSTS_BARRIER / SQ_INSTS_VALU"
  evidence: "barrier 宽度与每 barrier 工作量不匹配时，MMAC 发射率被同步打断"
  cost: M

- id: layout-pack
  statement: "是否每一步都付一次 pack/shuffle/转置"
  law: L10
  class: layout
  precondition: "变体输入布局与生产 kernel 输出布局不一致"
  check: "对比变体与生产 kernel 的 tensor stride/dtype；pmc: GRBM_COUNT 看是否多一次 kernel"
  evidence: "每换一次数据组织就多一份搬运；微基准快、生产掉分多半是这条"
  cost: M

- id: table-miss
  statement: "该 shape 是否落在库的调优表里（未命中往往是最大收益）"
  law: L1
  class: tier
  precondition: "目标是 MoE / grouped GEMM 且走的是查表型后端"
  check: "打印 get_aiter_moe_config 的 solution_type / 查 DeepGEMM MODE 表"
  evidence: "AITER 慢通常意味着查表没命中，而不是 kernel 慢"
  cost: S

- id: fusion-boundary
  statement: "融合是否把本可并行的 kernel 串成了依赖链"
  law: L2
  class: pipeline
  precondition: "候选是融合改动，且原 kernel 之间本可并行"
  check: "用 scripts/opbench.py bench_fn 分别量融合版与分拆版的 sum"
  evidence: "pre_big_fuse 把独立 kernel 串成依赖链并多占 smem，实测慢 1.7x"
  cost: L

- id: precision-drop
  statement: "能否降到 fp8/int8 且仍过契约容差"
  law: L8
  class: precision
  precondition: "主口径对 fp32 参考有足够余量；压力档无相对退化"
  check: "opcheck correctness --contract <card>/contract.yaml；看 max_abs vs 容差"
  evidence: "降精度是唯一能在不改结构的前提下改变算术强度的手段"
  cost: L

- id: split-k
  statement: "split-K 切片数是否按 shape 单独搜过"
  law: L9
  class: residency
  precondition: "M 小且 N/K 大，单个 CTA 的 K 维工作量过长"
  check: "scripts/opbench.py bench_fn 扫 s = 1,2,4,8，5 轮取中位数"
  evidence: "shipped 默认 s 往往不是最优；plan 层存在的理由就是这个"
  cost: S

- id: gather-path
  statement: "数据搬运（gather/scatter）是否在关键路径且串行"
  law: L5
  class: memory-path
  precondition: "attention / indexer 类算子，且 MMA 占比远小于搬运"
  check: "pmc: 对比 MMA 指令占比与 gather 相关指令/等待时间"
  evidence: "FP8 MLA 消融：MMA 只占 40ms 中的 3.3ms，gather 占约 9ms 且完全串行"
  cost: M

- id: cross-lane-fold
  statement: "跨 lane 归约是否用了更长指令序列（如 shfl 而非 bpermute）"
  law: L5
  class: pipeline
  precondition: "epilogue 含跨 lane 归约，且 VALU 中非 MMAC 占比高"
  check: "pmc: SQ_INSTS_VALU 与 MMAC 指令数之比；查 epilogue 归约写法"
  evidence: "grouped MQA 换成 ds_bpermute_b32：VALU -15.8%，墙钟 1.29x，逐位一致"
  cost: S
