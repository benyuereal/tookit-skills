- id: prefetch_1slice
  kind: stalled
  direction: bypass-tilelang-codegen
  parent_surface: cross-lane-fold
  ratio_vs_parent: '1.195'
  what_changed: '把 T.copy(KV_spilt0_local→shared) 提到循环体最前、切片0 的 gather 索引改成 min(i_i+1, vN-1)、循环前加 prologue —— 结构上多了一段跨迭代的寄存器依赖， 不再是纯 T.Pipelined 主体

    '
  why: '**预取方向彻底关闭（第 3 次独立复现）**。只预取切片 0（把 `T.copy(KV_spilt0_local→shared)` 提到循环体最前，切片0 的 gather 索引改成 `min(i_i+1, valid_NI-1)`，循环前加 prologue）——S=128 base 0.9071 → 1.0839（**+19.5%**）、S=64 0.4153 → 0.5763（**+38.8%**），输出**逐位一致**。加上此前的
    3 片预取（+33%）与 2 片（+21%），与在途片数正相关但仍单调为负。**机制（推测，未单独坐实）**：`KV_spilt0_local` 变成循环携带寄存器依赖（本轮末写、下轮初读），破坏了编译器对 `T.Pipelined` 主体做软件流水/展开的能力；同时 `T.min(i_i+1, ...)` 的地址算式落在内层 `T.Parallel` 里，每元素重算一次。⇒ 不是「预取这个想法错」，而是「在
    num_stages=0 的循环里手工加预取 = 用循环携带依赖换重叠，后者更贵」。要真做重叠得在编译器层面重排（即 handwrite_mainloop 的原意），而我们已论证它被 LDS/VGPR 预算卡死。'
  true: '2026-11-13'
  reclassified_from: refuted
  reclassified_why: '2026-11-23：本条 why 原文已写明「不是预取这个想法错，而是在这个循环结构里 手工加预取不划算」—— 这正是 stalled 的定义（变慢但结构变了）。 原先记成 refuted 会连带封掉 bypass-tilelang-codegen 方向，属于误判死。 改记 stalled 后，它可作为「编译器层面重排」路线的前置父代。

    '
