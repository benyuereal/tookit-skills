- id: gemm_is_bottleneck
  kind: claim
  why: 否：热工作集下同一份 kernel 的 GEMM 路径达 135~138 TF（≈55% 峰值），GEMM 只占总时间约 21%（0.067/0.327）。瓶颈是 gather 带宽，不是 GEMM 效率。
- id: l2_table_wrong_scale
  kind: claim
  why: 否（我中途的错误结论）：当初拿 4.6 MB 的表当「L2 常驻」，那不是缓存尺度；真正进缓存（72 KB / 576 KB）时快 4.9×/3.7×。⇒「缓存常驻」必须按设备实际缓存容量取值，不能用 MB 级表想当然。
- id: skv_scale
  kind: claim
  why: 否，SKV 8k→64k 无影响（差异在噪声内）。后面 bm64 战役的复测也印证：三档台面 0.7816→0.8004（+2.4%），涨的是 fm（+81%）。
- id: precision_artifact
  kind: claim
  why: 否，两者精度等价（对 fp32 稠密参考 max_abs 同量级）。慢不是精度/参考实现的问题，别往这个方向查。
- id: prefetch_split3_too
  kind: claim
  why: 慢 1.7×（输出仍逐位一致）。spilt3 原本直接从寄存器喂 MMA，搬进 shared 后多出 12 KB 的 local->shared 写 + shared 读；VGPR 217→231 未 spill，纯粹是 LDS 流水被压满 ⇒ LDS 带宽也是这条链路的共存瓶颈，不能拿它换寄存器。
- id: merge
  why: 慢 2.12×，VGPR 256 / spill 30。4 路切分是「寄存器生命周期分段」：4 个小 buffer 顺序复用同一批 VGPR，合成 1 个 [32,512] 大 buffer 后生命周期全程重叠，直接顶爆 256 硬上限。
- id: kv4
  why: 慢 1.73×，spill 10。与 merge 同一个死法（把多个 fragment 合成一个更大的）。
- id: g2s
  why: 慢 2.09×，逐位一致。gather 直写 shared 本身中性（bm32 上测过），这里同时把 split3 分片也换成独立 buffer，等价于 kv4 超集。
- id: imask
  why: 'layout 推断拒绝：Fragment((32,) -> (4,), replicate: 32) 与 gather 的 [BI, D_spilt] 行映射不兼容。绕法要再垫 shared+barrier，而那 8 条读全 L1 命中，净收益≈0。'
- id: kpack1
  why: 慢 28% 且算错（maxdiff 4.57e-01）。block_I=32 的 gemm2 依赖 kpack=2 的 k 打包。
- id: reord
  why: 慢 1.1%。那条 16 标量 LDS 拷贝实际是 prefetch：删掉它 gemm0 的 B 操作数变冷启动。⇒「某段指令值 7.5%」不能读成「删掉它能省 7.5%」。
- id: nomax
  why: 快 12.4% 但 logit std≈20 时 38269 个元素 nonfinite（exp2 越过 2^127）。被 maxn 支配。
- id: max1
  why: 比 maxn 慢且更不准：把 exp2 基准钉在最不准的第 0 块，std≈10 档 max_abs 是 maxn32 的 2.5×。
- id: swizzle_layout
  why: 9 种 annotate_layout 全扫，最好的 major_pack=2 是 −0.1%（噪声内），linear +13.9%。默认注入的就是那条 XOR swizzle，8.72M 次冲突不是布局可修的。
- id: policy_swap
  why: FullRow/FullCol/Square 三档都出 NaN；FullColK 是唯一既快又对的。K 切分是这套布局的前提。
- id: bm64_any
  why: bm64 必然溢出，与写法无关：Q_spilt0..3_shared[64]=128 VGPR + acc_o0..3[32]=128 VGPR = 256 恰好等于硬上限，还没算 KV 片段 32 + A/B 临时 40 + acc_s 16。thr512 能缓解寄存器但名义带宽塌到 198 GB/s。
- id: thr128
  why: 慢 6.7×。block_I=32 的 tile 分片被写死成 256 线程布局，降到 128 后每线程工作量翻倍，寄存器压力反而不降。
- id: q_in_shared
  why: 慢 3.0×。Q 跨全部 64 个 KV 块只读且不变，在寄存器里是一次性成本；搬进 shared 变成每次 MMA 都要读 LDS，把 VGPR 压力换成 LDS 流量，方向相反。
- id: bi64
  why: 慢 3.2~3.4×。KV_shared 的 LDS 随之翻倍，把并发和向量化一起打崩；BI=128 直接 LDS 超限。
- id: bi16
  why: 归约确实归零（纯 shfl、0 barrier），但块数翻倍 + MMA 的 n 掉到 16，净亏 27%。
- id: num_stages
  why: ns=1 零效果（差异在噪声内）⇒ 内核里根本没有实质流水重叠，这是「计算侧慢 2.2×」的最可能方向。
- id: prefetch_on_bm32
  why: bm16 时代快 5~6% 的预取，在 bm32 上反而慢 20%。REPLICATE_H 4→2 后 CTA 数减半、寄存器已顶到 256，在途缓冲没有第二组 CTA 兜底。⇒ 任何优化都要在 bm32 基线上重测。
- id: gather_direct_shared_bm32
  why: 中性（0.8117 vs 0.8107，噪声内），VGPR 没降。那 24 个 VGPR 本来就是短命临时，不是压力来源。
- id: splitkv_larger
  why: S≥128 单调变差：每 CTA 工作量变小 + combine 开销。S=128 最优就是 ns=1。
- id: transpose_lds
  why: 硬件没有这条指令。gfx938/gfx942 不支持 ds_read_b64_tr_b16（gfx90a/gfx950 支持），7 种拼写与 LLVM 内建都不存在。⇒ 任何「对标 aiter PV 写法」的方案不用试。
- id: single_layout_for_both_gemms
  why: 数学上不可能：QK 要 8 个连续 d、PV 要 8 个连续 k，两者在 [k][d] 上正交，任何双射布局都无法同时成立。必有一侧付标量代价，且总量与哪一侧付无关 ⇒ 转置 tile 的净收益恒等于 0。
- id: pv_register_operand
  why: 编译期否决：LayoutInference FATAL 'Get different layout for KV_spilt3_local'。跨 lane 换布局在 tilelang 里只能走 shared，那 64 条标量 LDS 是结构强制的。
- id: index_sorting_for_dram
  why: 降级未验证。我们的 DRAM 读字节已经和 fm 相等，池缩 64× 也只快 1.05% ⇒ 排序省的是我们本来就不缺的东西。只有「排序能同时减少片上复读（LDS/TA 指令）」这一形态才值得验。
- id: lds_bank_conflict
  why: 不是区分项：厂商调优 matmul（88% MFMA 峰值）自己就有 12.6% 冲突占用率，我们 bm32 只有 9.8%。真区分项是 LDS 指令条数（3.14× fm）与非 MFMA 向量指令条数（4.25×）。
- id: reduce_valu_count
  why: VALU 指令数是症状不是病因。删掉最大的一块（acc_o *= alpha 重缩放，每块每线程 32 条 mul）只换回 1.1%。⇒ 别以「减少指令」为目标，除非先证明它落在关键路径上。
- id: remove_leading_barrier
  why: 去掉前导 Barrier::sync() 快 2.9% 但 2.6M/4.2M 元素改变、max_rel≈1.0。它保护的是「同一 slot 被下一轮寄存器覆写」的 WAR。正解是 batch=4 合并，不是删 barrier。
- id: occupancy_2cta
  why: 做不到：bm32/thr256 显式局部数组已占 ≈168 VGPR，编译器实测 256；要到 128 以下需砍掉一半以上，且要把寄存器搬到 LDS，而 LDS 指令正是要砍的东西。
- id: lds_pitch_swizzle_handhip
  why: 手写 HIP 版上改 LDS 行 pitch（256B→280B 奇数 bank）+ GEMM2 标量 B 读改 128-bit + S_shared pitch：PMC bank 冲突 8.72M→8.72M（0 变化）、墙钟 1.000×。那 12%「等 LDS」在 gfx938 上被流水吸收，不是串行瓶颈。与旧 swizzle_layout（tilelang annotate_layout
    9 种）同结论：冲突数消不掉也换不来墙钟。
- id: launch_bounds_force_2cta
  why: 手写 HIP 版 `__launch_bounds__(256,2)` 强压 VGPR 换 2 CTA/CU：aicc 忽略 minBlocks 请求，VGPR 252 纹丝不动（读 GPU ELF notes 验证），性能/输出 1.000× 一致。occupancy 墙对这套编译器只能靠 kernel 重分片破，launch_bounds 不是 lever。
- id: thr512_bm32
  why: 'threads=512 + block_m=32（H=64 no-split，tilelang 直接生成）：S=128/320k 0.9425 vs 0.8102 ms（+16.4%）。M=32 摊到 8 个 wave、每 wave M=4，MFMA 吃不满——坐实 ledger #16 对 thr512 的推断（之前只和 bm64 配过）。'
- id: wdra_flag
  why: WDRA（-mllvm=-vgpr-greedy-alloc-mode=local-wave，tilelang TL_ENABLE_HCU_WDRA 的对应项）在同体 kernel 上 +1.2% 更慢（逐位一致）。mllvm 延迟模型扫描（mmac/ds-latency 全组合）也是 0%。调度 flag 对本 kernel 已是局部最优。
- id: prefetch_on_h64_bm32
  why: prefetch 在 H=64/bm32（GLM 生产形状）上 +21.3% 更慢（逐位一致，320k 真池实测）——与旧 prefetch_on_bm32 的「慢 20%」吻合。该 lever 只对 H=16/bm16（REPLICATE_H=1）成立，H=64 档别试。
- id: lds_cut_to_3cta
  why: 想把动态 LDS 从 28672 压到 ≤21845 换 3 CTA/CU（VGPR 侧允许 3，LDS 是唯一约束）。**结构上不可达，不是调参问题**：① QK 阶段的 acc_s 必须凑齐整个 d=512 才能做 online-softmax，所以列切片 0/1/2 必须同时在 LDS（3×8192=24576），切片 3 不进 LDS（QK 直接读 KV_spilt3_local
    寄存器）；② PV 阶段切片 3 复用 buf0，前提是 PV0 已经消费完切片 0——现有顺序 QK0,1,2 → (softmax) → PV0 → 写切片3→buf0 → QK3 → PV1,2,3 已经是这条约束下的最紧排布；③ 24576 + S/workspace 4096 = 28672 正好是当前值，**零余量**。压下去只有三条路：bi 32→16（已证伪，净亏 27%）、列宽
    128→64（总量不变，QK 仍需整个 d 驻留）、d 跨 CTA 切分（算法改动：部分 acc_s + 跨 CTA 归约）。⇒ 当前 tiling 下 2 CTA/CU 已是上限。
  kind: impl
  note: 但方向本身没死：1 CTA/CU 比 2 慢 67~69%（LDS 探针实测，见下面 lds_occupancy_probe），用 1/(1+a/n) 拟合 a≈4.25 ⇒ 若真能到 3 CTA/CU 约值 23%。要拿到它只能走「d 跨 CTA 切分」，那是重写级改动。
- id: lds_occupancy_probe
  why: '**这不是失败的候选，是校准数据**（放在 refuted 里是因为它不是待跑项）。把 SMLA_GLM_SHARED_BYTES 28672→40960（kernel 只读前 28672，输出逐值 bit-identical）强制成 1 CTA/CU：S=64 0.3975→0.6644 ms、S=128 0.7865→1.3276 ms，ABBA 四轮可复现 ⇒ **基线是 2 CTA/CU，且
    1 CTA/CU 慢 67~69%**。这条同时证伪了旧结论「occupancy=1 CTA/CU，等 gather 时无 CTA 可切」——那是 VF_LIMIT 常数错（65536，应为 768 模式的 196608）算出来的假象。'
  kind: claim
- id: cross_head_kv_reuse_g64
  kind: direction
  direction: raise-heads-per-wave
  parent_surface: occupancy
  why: '**在 gfx938 上不可行，且不是实现问题，是三条硬约束互斥（先算后写，没动代码）。** ① **复用维度只能是 head**：topk 索引按 (token, kv_group=1) 共享，同一 token 的 64 个 head 读同一份 2048 行 KV ⇒「一份 KV 只读一次」⇔ 一个 CTA 覆盖全部 heads ⇔ bm=64 / REPLICATE_H=1。② **寄存器按
    head 数线性膨胀，且 acc_o 与 Q_spilt 同阶**：两者各需 `bm·512/thr` VGPR/线程（bm32/thr256 = 64+64 = 128，实测声明段 120、编译器 256；bm64/thr256 = 128+128 = **256，恰好等于单线程硬上限**，还没算 KV fragment ≈32 与临时量 ≈90 ⇒ 声明段 342）。R1 ⇒ 编译前即可判「必然
    spill」，实测 scratch 141 B（另一 build 636 B）、DRAM 420→1724 MB（4.09×）、墙钟 +98%。③ **退到 thr512 能消 spill**（acc_o/Q 各 64，总 252、scratch 0），但同时 heads/wave = `64·bm/thr` 从 16 掉回 8（LDS/MFMA 1.16→2.19），且 768-VGPR 模式下
    `VF_LIMIT/(256·thr)`=196608/131072=**1 ⇒ CTA/CU 掉到 1**（R3；1 CTA/CU 实测比 2 慢 67~69%），墙钟 +38.6%（S=128/320k，三档 SKV 一致）。**三条不等式无解**：heads/wave=16 且 m=64 ⇒ thr=256；放得下 ⇒ `2·bm·512/thr + 临时量(~128) ≤ 256` ⇒
    bm ≤ 32；occupancy≥2 ⇒ `256·thr ≤ 98304` ⇒ thr ≤ 384。**没有任何 thr 同时满足。** 收益侧同样不成立：复用只把逻辑 KV 读 512→256 MiB（内存地板 311→156 µs），而实测 DRAM 348 MB 在 1724 GB/s 下只占 202 µs = 实耗 693 µs 的 **29%**（MBU 26.9%，无单元打满），且要完全串行才拿得到这
    101 µs ⇒ **上界 ≈14.6%**，覆盖不了任何一条路 38.6%/98% 的代价。**LDS 不是约束**（24576+bm·bi·4：bm64=32768=50%，仍允许 2 CTA/CU）；**occupancy 在 thr256 也不会掉到 1**（VGPR 允许 3、LDS 允许 2）——杀的只有 VGPR 这一项。'
  note: '**可迁移机制（换算子/换设备都成立）**：(a)「复用一份输入」的收益上界 = **该输入在墙钟里的占比**，不是「字节数减半」；先在 PMC 看对应单元占用率，<50% 就别指望复用换时间。(b) 要让一个 CTA 服务 N 个消费者，累加器按 N 线性膨胀；判据 = 先算 `acc_vgpr = N·输出宽·4B/(thr·4B)`，它与输入片段 VGPR 之和必须 ≤ 单线程硬上限（gfx9
    = 256），否则 R1 直接否，不用编译。(c)「抬 amortization（heads-per-wave）」与「抬占用（CTA/CU）」在 thr 上反向：前者要 thr 小、后者要 thr 大，同一个 N 撑不住两边时该换算法而不是调参。**同时判死 candidates:bm64_vgpr_squeeze 的可行路径**：要压的 ~128 VGPR 几乎全是 Q_spilt，把 Q
    搬出寄存器已在 bm32 上实测慢 3.0×（refuted:q_in_shared），剩下的临时量不是主项；按本轮「只追加」纪律未改该条 status，loop 侧应改判 refuted。'
  device: gfx938 / BW1100 / sclk 1200 MHz（测量时）/ CU=64（torch multi_processor_count 探测；constants.yaml 记 69、tilelang 头注释记 70，三者不一致，见 device_dependency）
  device_dependency: '**换设备必须重算**：VF_LIMIT 取决于是否开 `-support-768-vgprs`（768 模式 = 4·64·768 = 196608；非 768 = 65536）。若目标设备不在 768 模式，连基线 bm32/thr256 的 CTA/CU 都会从 2 掉到 1，本条所有相对耗时与 occupancy 论证作废、须重测。LDS 容量非 64
    KB、或单线程 VGPR 上限非 256 时，②③ 的不等式要按新常数重写。**本条只承诺在 gfx938 + 768-VGPR 模式下成立；其他 gfx 未验证。** CU 数也不要用本文件的 64/69/70 任一值当判据：本声音 CU 只影响 rounds 与 per-CU 摊销，不影响 ②③ 的寄存器/占用不等式，但会影响任何绝对耗时预测。'
  source: derive.py sparse-mla --s 128 --h 64 --topk 2048 --d 512 --replicate-h {1,2} --bm {32,64} --thr {256,512}（复算内存地板 311.4→155.7 µs、LDS 28672→32768、thr512 时 CTA/CU=1）；kb/op-opt/sparse-mla-20261027.md
    §14.3 / §15.2 / §20.1；candidates.yaml:bm64_any / thr512_bm32 / q_in_shared / lds_occupancy_probe；2026-11-13 同进程 ABBA 基线复测
  verified_on: '2026-11-13'
- id: s128_gap_is_card_dependent
  why: '**「S=128 落后 flash_mla 1.07×」不是通用事实，是卡 0 的现象**（2026-11-13 同进程 ABBA 四轮、组内 MAD <0.1% 的干净测量）：卡 0 fm 0.6464 ms / hip 0.6931 ms ⇒ 1.073×；卡 4 fm 0.7074 / hip 0.6927 ⇒ 0.979×；卡 6 fm 0.7140 / hip 0.6933
    ⇒ 0.971×。**我们的实现三张卡一致（0.6927~0.6933，漂移 0.1%），变的是 flash_mla（0.6464~0.7140，10.5%）** ⇒ 跨实现比值不是卡不变量。S=64 无此问题（fm 0.3814~0.3836、hip 0.3507~0.3509，三卡一致）。根因未定位（CU/arch/L2 三卡完全相同：CU=64、gfx938、8 MB；疑似 KV 335
    MB 池的物理页/DRAM bank 分布只影响 fm 的 713 MB 重读、不影响我们 348 MB/L2 命中 50% 的访问模式）⇒ 引用「S≥128 站位」时必须带卡号，且先确认当时卡上没有别的负载。'
  kind: claim
  note: 测量纪律补一条：本轮复测期间遇到外部负载（无本地进程、hy-smi HCU% 仍显示 0.0%，但 sclk 1200→1350 MHz、两实现同时慢 20~30%、比值被压平）——**hy-smi 的 HCU% 不能证明卡空闲**，判据要用「重复测量的组内 MAD」：干净时 <0.1%，被占时 >5%。
  device: gfx938 / BW1100 / CU=64 / sclk 1200 MHz；三卡同一 arch、同一 L2（8 MB）、同一 CU 数
  device_dependency: 只在 gfx938 三张卡上各测一次，未做卡间交叉复验（同一次测量内 fm/hip 同进程交替，比值可信；绝对 ms 随负载漂移）。其他 gfx 未验证。
  source: /tmp/calib_s128.py（卡 4）、/tmp/recheck128.py（卡 0、卡 6），2026-11-13
  verified_on: '2026-11-13'
- id: bf16_mls_matrix_load
  why: '**bf16 走不了 MLS（硬件矩阵 LDS 读），这是编译期硬约束**。给 Q 的 global→shared `T.copy` 加 `prefer_instruction="matrix_load"` 后编译失败：`MatrixLoad dst Gemm consumer must have kPack=1, got 2`。我们的 `kpack = min((kv_vectorized+3)//4,
    2) = 2`（由 gather 向量化宽度推出，mmac_k=32），而 MLS 要求 k_pack=1；把 kpack 降到 1 等于把 gather 宽度砍半，伤访存，不划算。⇒ **MLS 只能经由 fp8 取得**（`gemm_fp8_channelwise` 用 k_pack=1 + MLS，gfx938 8192³ 432 TF vs 标量 LDS 332 TF）。这条同时说明：fp8
    不只是精度/显存选项，它是解锁 MLS 的前提。'
  kind: impl
  note: gfx938 / 2026-11-13 / S=128 与 S=64 均在编译期失败，未产生性能数字。脚本 /tmp/mls_bench.py。
