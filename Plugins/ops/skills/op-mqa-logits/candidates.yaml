- id: lightop-mqa-int8
  what: lightop::mqa_int8::m64（v3 在用）
  status: blocked
  blocker: |
    **需先核对接口与语义**。生产 trace 里的名字是
    `lightop::mqa_int8::m64<32,true,true,true,true,0,32>`，
    但 Python 层怎么调、签名是什么、是否要求 q 已量化 —— 全未知。

    核对方式（**不要凭名字猜**）：
      import lightop
      [x for x in dir(lightop) if 'mqa' in x.lower()]

    **关键疑点**：6.6x 远超「int8 省一半带宽」的 2x 上限。
    必须先验证它算的是同一个东西（见 roofline.json 的 quant_ceiling）。
    如果它漏算了什么，那 6.6x 是假的，不能作为本卡的目标。

