# op-rmsnorm-fused 变体矩阵。

variants:
  - name: ref-heavy
    source: "本卡 _common.py 的纯 torch fp32 参考"
    status: reference
    applies_to: [tiny, decode-m1, decode-m32, prefill-8k]
    constraints:
      - "只用于正确性对照，不是性能候选"
    mutates_inputs: false

  - name: lightop-fused
    source: "lightop 的融合 norm 族"
    status: primary
    applies_to: [decode-m1, decode-m32, prefill-8k]
    constraints:
      - "融合残差版本会原地改写输入，多变体对比须各喂副本"
    mutates_inputs: true

  - name: torch-native
    source: "torch 原生 rms_norm（若能用到）"
    status: fallback
    applies_to: [decode-m1, decode-m32, prefill-8k]
    constraints:
      - "不融合残差，字节数比融合版多一次往返"
    mutates_inputs: false

  - name: fused-3pass-triton
    source: "triton 融合单 kernel（kD：noMask, BLOCK=H, rows/CTA=1, num_warps=4）"
    status: candidate
    applies_to: [prefill-8k, decode-m32]
    constraints:
      - "H 必须是 2 的幂（无 mask 版本假定 H == BLOCK）"
      - "输入宽度 H=4096 时 BLOCK=4096，需 num_warps=4 才不超 shared/LDS"
      - "`num_warps` 与 `rows/CTA` 已扫 12 组合全部收敛到同一档；改这两个参数不会有收益"
    mutates_inputs: false
    measured: "cold-L2 186.2 us / 1081 GB/s（util 0.63/1724）；hot-L2 119.2 us 是缓存假象"
