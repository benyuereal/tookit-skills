# op-rmsnorm-fused 契约
# 状态 draft：门已定义且 adapter 就绪；缺的是本机融合实现。

op: rmsnorm-fused
version: 1
math: "y = w * (x / sqrt(mean(x^2, -1) + eps))；融合残差时把 x 换成 (x + r)"

shapes:
  x: [M, H]
  weight: [H]
  r: [M, H]
  y: [M, H]

dtypes:
  x: bfloat16
  weight: bfloat16
  acc: float32
  out: bfloat16

layout_constraints:
  - "RMSNorm 固定沿最后一维（hidden）归一；换维度就是另一个算子"
  - "融合残差时若是原地写，输入会被改——多变体对比必须各喂独立副本"

tolerance:
  vs_fp32_ref:
    # 2026-11-25 改判据：绝对容差在 bf16 输出上不可移植。
    # bf16 只有 7 位尾数，ULP 随量级变：
    #   [0.5,1) ULP=2^-8=0.00390625 / [1,2) 2^-7=0.0078125 / [2,4) 2^-6=0.015625
    # 实测 max_abs=1.5625e-2 = 2^-6，在 [2,4) 区间**正好 1 ULP**（完美舍入）。
    # 而旧的 max_abs=2.0e-3 只够 0.13 ULP —— 等于要求比 bf16 能表示的还准。
    # 铁证：四个变体全 FAIL，**含厂商 lightop**。判据错，不是实现错。
    mode: ulp_bound
    max_ulp: 2
    # max_abs 必须保留（opverify 的 REQUIRED 规则：它是 ULP 判据失效时的兜底上界）。
    # 2 ULP 在最大量级 [2,4) 上 = 2 × 2^-6 = 3.125e-2；取此值使两种模式口径一致。
    max_abs: 3.125e-2
    cosine: 0.99999
    note: "bf16 输出按量级判 ULP；2 ULP 给 eps 位置差异留余量"
  variant_vs_variant:
    mode: tolerance

invariants:
  - name: determinism
    mode: bit_exact
    repeats: 5
  - name: residual_semantics
    mode: tolerance
    note: "融合残差时输出必须等于 rmsnorm(x + r)，不是 rmsnorm(x) + r"
  - name: eps_position
    mode: tolerance
    note: "eps 在 sqrt 内（sqrt(mean+eps)）——与参考实现一致"

gates:
  - name: correctness
    template: correctness
    required: true
  - name: invariants
    template: invariants
    required: true
  - name: perf
    script: bench/bench.py
    required: false
    require: "median_ms <= baseline_ms * 1.02"
    repeats: 3
    skip_reason: "待建 bench；本卡的性能判据是带宽达成率不是相对基线"

floor:
  metric: hbm_bandwidth
  peak: 1724
  unit: GB/s
  basis: "读 x(+r) + 读 w + 写 y = 2*M*H*2B（不融合残差）或 3*M*H*2B（融合）。字节数完全确定"
  source: "op-roofline/constants.yaml:conflicts:peak-bw-definition；一律用实测 1724，不用标称 1100"
  status: measured
  at_floor_threshold: 0.85
