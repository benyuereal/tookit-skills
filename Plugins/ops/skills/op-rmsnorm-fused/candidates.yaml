  no_sweep: true
  bench_args:
  - --shape
  - prefill-8k
  - --base
  - lightop-fused
directions:
- id: fusion-boundary
  statement: 残差融合是否真的省了往返：3*M*H*2B vs 4*M*H*2B
  status: open
  refutes: 0
- id: layout-pack
  statement: 端到端读写了几遍：是否有多余的中间张量导致多一趟 HBM
  status: open
  refutes: 0
- id: occupancy
  statement: 小 M 时 grid 是否填不满 CU；norm 的 CTA 数是否够
  status: open
  refutes: 0
candidates:
- id: fuse-residual
  direction: fusion-boundary
