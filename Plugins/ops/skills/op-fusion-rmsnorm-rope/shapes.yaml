# op-fusion-rmsnorm-rope 形状档位
#
# 三档覆盖 M 方向：decode 单 token / 小 batch decode / prefill。
# **S 项要求 geomean <= 1.0 才算通过**（2026-11-26 加的方向判据），
# 所以这里必须至少 3 个形状，且每个都要真跑。

decode-m1:
  params:
    B: 1
    S: 1
    H: 32
    H_kv: 8
    D: 128
    max_pos: 4096
  note: "单 token decode：M 极小，融合的固定开销占比高，最容易输给厂商"

decode-m32:
  params:
    B: 1
    S: 32
    H: 32
    H_kv: 8
    D: 128
    max_pos: 4096
  note: "小 batch decode：融合开始有优势的临界区"

prefill-8k:
  params:
    B: 1
    S: 8192
    H: 32
    H_kv: 8
    D: 128
    max_pos: 4096
  note: "prefill：字节数主导，最接近纯带宽地板"

tiny:
  params:
    B: 1
    S: 4
    H: 2
    H_kv: 1
    D: 128
    max_pos: 128
  note: "只做正确性门的自检；绝不用于 bench"
