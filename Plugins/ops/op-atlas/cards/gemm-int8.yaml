id: gemm-int8
title: INT8 GEMM（W8A8）
family: gemm
math: out = (A_i8 * s_a) @ (B_i8 * s_b)；acc=int32，出栈时反量化
status: measured
layer: kernel
op_card: null
impls:
- repo: deepgemm
  library_profile_ref: libraries.md §6
  file_hint: m_grouped_i8_gemm_nt_contiguous（W6 packed）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - grouped / MoE 的 INT8 路径
  - 需要按 layout 精细控制（W6 packed）
  not_for:
  - 普通稠密大 GEMM（hipBLASLt 走 torch 路径即可）
  - layout 没配对时（不是慢，是静默错）
  pros:
  - int32 累加无精度损失风险
  cons:
  - W6 packed 需要配套 prepack；layout 选错静默错
  source: references/libraries.md
  import_path: deepgemm.m_grouped_i8_gemm_nt_contiguous
  signature: m_grouped_i8_gemm_nt_contiguous(...)
  smoke_test: python3 -I -c "import deepgemm; assert hasattr(deepgemm,"m_grouped_i8_gemm_nt_contiguous")"
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter 的 INT8 GEMM 入口
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 标准接入
  not_for:
  - 需要单一路径可预测性能
  pros:
  - 统一 API
  cons:
  - 查表未命中会静默降级
  source: references/libraries.md
  import_path: aiter.gemm_a8w8_opus
  signature: gemm_a8w8_opus(...) —— INT8 GEMM 入口
  smoke_test: python3 -I -c "import aiter; assert hasattr(aiter,"gemm_a8w8_opus")"
ceiling:
  kind: missing
  ref: null
  bound: compute
  note: INT8 的算力峰值与 FP8 不同；分母必须按 dtype 分开取，不能沿用 FP8 的
shapes:
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  kb_path: null
  ratio:
    value: 343.4
    vs: INT8 算力（TFLOPS，非倍数）
    scope:
      cards: 1
      in_len: M/exp=128 K=2048
      out_len: N=1536
      warmup: hot
      note: E=32 grouped contiguous；MAD=0.0032 占中位数 4.3%，两次跑 343/363 TF 有 5% 波动
  conclusion: INT8 grouped 达 343 TFLOPS、1621 GB/s；MAD 为中位数的 0.043，该形状测量不稳
  verified_on: '2026-11-23'
modify_path:
  kind: env-flag
  what: 选 W6 packed 的 layout 入口
  how: 用 m_grouped_i8_gemm_nt_contiguous 并确保权重经 pack_w8a8_gfx936_weight_to_w6 打包
  requires: 权重已按 W6 packed 预处理
hard_preconditions:
- statement: contiguous 形态的权重必须经 marlin_i8_contiguous_weight 打成 6D W6 layout
  check: '不打包直接传 → ValueError: expects W6 packed weight [E,K/64,N/16,4,16,16]'
- statement: a 必须是 2D [E*M, K]（contiguous 形态），3D 会报 input must be [M,K]
  check: '传 3D a → RuntimeError: input must be [M,K]'
soft_preconditions:
- 建议 hot 态且 ≥11 轮（该形状 MAD 达 4.3%）
surfaces:
- table-miss
- layout-pack
- split-k
updated: '2026-11-22'
