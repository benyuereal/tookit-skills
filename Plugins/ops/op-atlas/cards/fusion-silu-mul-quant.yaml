modify_path:
  kind: replace-call
  what: silu_and_mul + per_token_quant 两段换成单个 fuse_silu_mul_fp8_quant
  how: lightop.fuse_silu_mul_fp8_quant(gate_up, 0) 直接返回 (fp8_out, scale)；fp8type=1 走 e5m2，int8 用 fuse_silu_mul_quant
  requires: 输入须 2D [M, 2H]；3D 专家布局用 _ep 变体
hard_preconditions:
- statement: 入口必须可 import；3D 输入会抛 ValueError 而非自动 reshape
  check: python3 -I -c "import lightop,torch; o,s=lightop.fuse_silu_mul_fp8_quant(torch.randn(8,512,device='cuda',dtype=torch.bfloat16),0); assert o.shape==(8,256)"
- statement: 切分顺序是 [gate|up]（前半 gate，后半 up），弄反不报错只偏
  check: python3 -I -c "import torch,lightop; x=torch.randn(8,512,device='cuda',dtype=torch.bfloat16); o,s=lightop.fuse_silu_mul_fp8_quant(x,0); g,u=x[:,:256],x[:,256:]; ref=torch.nn.functional.silu(g.float())*u.float();
    print(float((o.float()*s-ref).norm()/ref.norm()))"
- statement: limit>0 才启用 clamp，且仅在 fp8 入口；传 -1.0 或 None 都关闭
  check: python3 -I -c "import lightop,torch; x=torch.randn(8,512,device='cuda',dtype=torch.bfloat16)*10; a=lightop.fuse_silu_mul_fp8_quant(x.clone(),0,limit=-1.0)[0]; b=lightop.fuse_silu_mul_fp8_quant(x.clone(),0,limit=2.0)[0];
    assert not torch.equal(a.view(torch.uint8),b.view(torch.uint8))"
