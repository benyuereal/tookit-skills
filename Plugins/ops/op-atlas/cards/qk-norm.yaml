id: qk-norm
title: QK per-head 归一化
family: norm
math: q = rmsnorm(q,-1)*w_q；k = rmsnorm(k,-1)*w_k
status: measured
layer: kernel
op_card: null
impls:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: qk-norm 融合
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - Qwen3 系模型
  - 需要与 rope 融合
  not_for:
  - hidden 维归一（那是另一个算子）
  pros:
  - 融合省一次 HBM 往返
  cons:
  - head_dim 契约需核对
  source: references/libraries.md
  import_path: lightop.fuse_rmsnorm_rope.rms_rotary_embedding_fuse
  signature: rms_rotary_embedding_fuse(positions, query, key, head_size, cos_sin_cache, is_neox, weight_q, weight_k, residual_q=None, residual_k=None, epsilon=1e-05)
  smoke_test: python3 -I -c "import importlib; assert hasattr(importlib.import_module("lightop.fuse_rmsnorm_rope"),"rms_rotary_embedding_fuse")"
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter.fused_qk_rmsnorm_rope
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - head_dim 非标准
  not_for:
  - 常规形状（无特殊布局需求）
  pros:
  - 完全可控，但需自己维护
  cons:
  - aiter 的 fused_qk_rmsnorm_rope 已把 per-head norm 与 rope 融合
  source: references/libraries.md
  import_path: aiter.fused_qk_rmsnorm_rope
  signature: fused_qk_rmsnorm_rope(q, k, cos, sin, ...)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import aiter\") ; assert hasattr(aiter,"fused_qk_rmsnorm_rope")"
ceiling:
  kind: missing
  ref: null
  bound: bandwidth
  note: 每头在 head_dim 上归一，与 hidden 维归一是两个算子
shapes:
- decode-m1
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  kb_path: null
  ratio:
    value: 741
    vs: 融合后带宽 GB/s（相对流式峰值 1724 为 0.43）
    scope:
      cards: 1
      in_len: B=8 S=2048
      out_len: H=32 D=128
      warmup: hot
      note: qk-norm 与 rope 融合；同形状 rope 单独为 338 GB/s
  conclusion: qk-norm+rope 融合达 741 GB/s，是 rope 单独（338）的 2.19 倍
  verified_on: '2026-11-23'
modify_path:
  kind: replace-call
  what: QK-norm 与 RoPE 合并成一次调用
  how: 用 aiter.fused_qk_rmsnorm_rope 替代「先 norm 再 rope」两次调用
  requires: aiter 0.1.6；head_dim 与 rope 的 rot_dim 需匹配
hard_preconditions:
- statement: fused_qk_rmsnorm_rope 的 freqs 必须 2D [seq_len, head_dim]，与 rope_fwd 要 4D 不同
  check: '传 [S, D/2] → RuntimeError: freqs must have shape [at least seq_len, head_dim]'
- statement: freqs 宽度要 head_dim（不是 head_dim/2）
  check: 见上；同库两个入口的形状约定不一致，易踩
soft_preconditions:
- 建议 hot 态
- 融合收益来自省一次 q/k 往返
surfaces:
- fusion-boundary
