modify_path:
  kind: replace-call
  what: for 循环里的逐 batch GEMM 换成一个 batched 入口
  how: 把 B 次 gemm_a16w16 换成一次 boltops.gemm.batched_gemm_bf16(x[B,M,K], w[B,N,K])，省 B-1 次 launch
  requires: x/w 都是 rank-3 且 B 相同；布局必须连续（否则先 .contiguous()，计时口径要算上）
surfaces:
- grid-tail
- layout-pack
- split-k
