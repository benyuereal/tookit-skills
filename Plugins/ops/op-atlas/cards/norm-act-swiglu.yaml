id: norm-act-swiglu
title: add + RMSNorm + SwiGLU 三合一融合
family: activation
math: xf = x + residual; h = w*xf/sqrt(mean(xf^2,-1)+eps); out = silu(h[:, :I]) *
  h[:, I:]
status: measured
layer: kernel
op_card: null
semantics:
  formula: xf=x+residual; h=w*xf/sqrt(mean(xf^2,-1)+eps); out=silu(h[:,:I])*h[:,I:]
  inputs:
  - x (M,H)
  - residual (M,H)
  - w (H,)
  outputs:
  - out (M,I)
  traffic_passes:
    reads: 3
    writes: 1
