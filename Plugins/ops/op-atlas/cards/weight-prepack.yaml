id: weight-prepack
title: 权重预处理（pack / shuffle / 量化重排）
family: quant
math: W_packed = prepack(W, fmt)；fmt ∈ {W6 packed, HIPC, marlin, aiter shuffle}
status: draft
layer: kernel
op_card: null
impls:
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter_moe_shfl_weight
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - AITER 的 MoE 路径（调用前必须先 shuffle）
  - 权重格式固定的生产部署
  not_for:
  - 权重每次请求都变化的场景（prepack 成本摊不掉）
  pros:
  - 一次 prepack，后续每个 token 都省
  cons:
  - 漏了不是慢，是静默算错——这是本条目存在的首要理由
  source: references/libraries.md
  import_path: aiter.moe_align_block_size
  signature: AITER 的 MoE 入口族（shuffle 在 moe_c 侧）
  smoke_test: python3 -I -c "import aiter; assert hasattr(aiter,"moe_align_block_size")"
- repo: deepgemm
  library_profile_ref: libraries.md §6
  file_hint: pack_w8a8_gfx936_weight_to_w6 / pack_w4a8_moe_hipc_weight
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - gfx936 的 W6 packed layout
  - W4A8 的 HIPC layout
  not_for:
  - 需要跨 gfx 复用的权重（layout 不通用）
  pros:
  - 按 arch 精细控制 layout
  cons:
  - 三种 layout（HIPC / W6 / marlin）不可混用，选错不是慢而是静默算错
  source: references/libraries.md
  import_path: deepgemm.group_gemm_weight_pack.marlin_bf16_masked_weight
  signature: marlin_bf16_masked_weight(weight, *, arch=None) -> Tensor
  smoke_test: python3 -I -c "import importlib; assert hasattr(importlib.import_module("deepgemm.group_gemm_weight_pack"),"marlin_bf16_masked_weight")"
