    tier: primary
    law_ref: "Plugins/ops/skills/op-roofline/references/pipeline.md#Q4"
    best_for:
      - "gfx936 的 W6 packed layout"
      - "W4A8 的 HIPC layout"
    not_for:
      - "需要跨 gfx 复用的权重（layout 不通用）"
    pros:
      - "按 arch 精细控制 layout"
    cons:
      - "三种 layout（HIPC / W6 / marlin）不可混用，选错不是慢而是静默算错"
    source: "references/libraries.md"

