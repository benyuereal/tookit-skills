modify_path:
  kind: replace-call
  what: rope 后再单独 scatter 写 KV 的两段换成同一个融合入口
  how: lightop.rms_rotary_embedding_fuse_with_kv_store(positions, q, k, v, cos_sin_cache, head_dim, page_size, k_buffer, v_buffer, loc, is_neox, w_q, w_k, dtype, None, None, 1.0, 1.0)；k_buffer 布局 [blk,H,page,D]，v_buffer
    布局 [blk,H,D,page]
  requires: kv cache 用 fp8 e4m3/e5m2 才走真融合；bf16 cache 会掉回 wrapper split 分支
