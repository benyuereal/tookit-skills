id: fusion-rope-kv-write
title: RoPE + 分页 KV 写入 融合（rope_kv_write）
family: kv
math: k,v = rope(rmsnorm(k,v))；再按 kv_cache_loc 写进 paged k_buffer/v_buffer
status: measured
layer: kernel
op_card: null
semantics:
  formula: q_rope, k_rope, v_out = rope(rmsnorm(q,k,v)*w) ; k_buffer[loc//page, :, loc%page, :] = k_rope ; v_buffer[loc//page, :, :, loc%page] = v_out
  inputs:
  - positions
  - query
  - key
  - v
  - cos_sin_cache
  - k_buffer
  - v_buffer
  - kv_cache_loc
  outputs:
  - q_rope
  - k_rope
  - v_out
  traffic_passes:
    reads: 3
    writes: 3
    source: 读 q/k/v（3）；写 q_rope/k_rope/v_out（3）。另外被原地写入的 k_buffer/v_buffer 未计入——它们与 k_rope/v_out 是同一份数据落两处，实际 HBM 写更多
  mutates_inputs:
  - query
  - key
  - k_buffer
  - v_buffer
variants:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/fuse_rmsnorm_rope.py rms_rotary_embedding_fuse_with_kv_store（真融合分支需 fp8 cache）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - decode 步里 rope+norm 后立刻落 paged KV（省一次中间态往返）
  - 需要 FP8 KV cache 时（fp8 e4m3/e5m2 cache 走真融合 kernel）
  not_for:
  - bf16 KV cache（会落回 wrapper 的 split 分支，见 cons——实测慢 2.18x）
  - 非 neox/interleaved 标准布局
  pros:
  - fp8 cache 路径是真融合：实测 T=2048/HQ=32/HK=8/D=128 下 0.1127 ms
  - 一次调用同时出 q_rope/k_rope/v_out 三份输出并写 k_buffer/v_buffer（实测 buffers_written=True）
  - 数值可对：fp8 cache 路径 q/k/v rel_l2 均约 0.027（fp8 舍入）；bf16 cache 路径 q/k rel_l2 0.0030
  cons:
  - 同一入口在 bf16 cache 下不是真融合：wrapper 的 use_fp8_e4m3=(dtype 不是 fp8) 判据写反，bf16 走 else 分支先调 op.rms_rotary_embedding_fuse 再用 Python 索引 scatter——实测 0.2452 ms vs fp8 路径 0.1127 ms，慢 2.18x
  - bf16 cache + head_dim>128 时更糟：直接走纯 Python scatter 分支（`k_buffer[loc_id,:,offset,:]=kv`），两次 kernel + 两次 HBM 往返
  - v_buffer 布局是转置的 [blocks, heads, dim, page_size]，与 k_buffer 的 [blocks, heads, page_size, dim] 不同；弄错不报错只写错位置
  - 硬约束 head_dim 只支持 128 与 256（实测 64 走 Python scatter 报 shape mismatch）
  source: references/libraries.md
  import_path: lightop.rms_rotary_embedding_fuse_with_kv_store
  signature: rms_rotary_embedding_fuse_with_kv_store(positions, query, key, v, cos_sin_cache, head_dim, page_size, k_buffer, v_buffer, kv_cache_loc, is_neox, weight_q, weight_k, output_dtype, residual_q,
    residual_k, k_scale, v_scale, epsilon=1e-05) -> Tuple[Tensor, Tensor, Tensor]
  smoke_test: python3 -I -c "import lightop,torch; T,HQ,HK,D=128,8,1,128; q=torch.randn(T,HQ,D,device='cuda',dtype=torch.bfloat16); k=torch.randn(T,HK,D,device='cuda',dtype=torch.bfloat16); v=torch.randn(T,HK,D,device='cuda',dtype=torch.bfloat16);
    w=torch.ones(D,device='cuda',dtype=torch.bfloat16); cs=torch.randn(128,D,device='cuda',dtype=torch.bfloat16); kb=torch.zeros(2,HK,64,D,device='cuda',dtype=torch.float8_e4m3fn); vb=torch.zeros(2,HK,D,64,device='cuda',dtype=torch.float8_e4m3fn);
    o=lightop.rms_rotary_embedding_fuse_with_kv_store(torch.arange(T,device='cuda'),q,k,v,cs,D,64,kb,vb,torch.arange(T,device='cuda'),True,w,w,torch.bfloat16,None,None,1.0,1.0,1e-6); assert len(o)==3 and
    o[0].dtype==torch.float8_e4m3fn"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/attention 同名导出（与顶层同一实现，仅 import 路径不同）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 上游测试是从 lightop.attention 导入的（保持一致）
  not_for:
  - 以为它是另一条实现——它就是同一个函数
  pros:
  - lightop.attention 也存在同名属性（实测 hasattr=True），两处指向同一 kernel
  cons:
  - 不是独立变体：两个 import 路径对应同一实现，不能当两条基线
  source: references/libraries.md
  import_path: lightop.attention.rms_rotary_embedding_fuse_with_kv_store
  signature: 与 lightop.rms_rotary_embedding_fuse_with_kv_store 完全相同（同函数，re-export）
  smoke_test: python3 -I -c "import lightop.attention as la; assert hasattr(la,'rms_rotary_embedding_fuse_with_kv_store')"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/fuse_rmsnorm_rope.py gammarms_rotary_embedding_fuse_with_kv_store（Gemma/mRoPE 变体）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要 mRoPE 三分量位置（mrope_section_t/h/w）的多模态模型
  not_for:
  - 标准 1D 位置（那用不带 gamma 前缀的入口即可）
  pros:
  - 同一 kv-store 契约上叠 mRoPE 分段，支持 positions 是 [3,T]
  - head_dim 上限放宽到 256（实测 256 走 Python 分支；128 走融合分支）
  cons:
  - 位置处理会先 torch.stack 三次再 contiguous，多两次拷贝
  - 与主入口共用同一套 bf16-cache split 分支问题
  source: references/libraries.md
  import_path: lightop.gammarms_rotary_embedding_fuse_with_kv_store
  signature: gammarms_rotary_embedding_fuse_with_kv_store(..., epsilon=1e-05, mrope_section_t=0, mrope_section_h=0, mrope_section_w=0, is_interleaved=False) -> Tuple[Tensor, Tensor, Tensor]
  smoke_test: python3 -I -c "import lightop; assert hasattr(lightop,'gammarms_rotary_embedding_fuse_with_kv_store')"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/fuse_rmsnorm_rope.py split_qkv_rms_rotary_embedding_fuse_with_kv_store_quant（QKV 打包版）
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 上游 QKV 已是打包 [T, q_size+kv_size*2] 一条张量时
  not_for:
  - 已拆好的 q/k/v（那用主入口，少一次视图换算）
  pros:
  - 省一次 QKV 拆包，直接吃打包张量
  cons:
  - 返回 3 个输出但签名是 qkv 单入参，与主入口的 q/k/v 三入参不同语义，不能直接互换
  source: references/libraries.md
  import_path: lightop.split_qkv_rms_rotary_embedding_fuse_with_kv_store_quant
  signature: split_qkv_rms_rotary_embedding_fuse_with_kv_store_quant(positions, qkv, q_size, kv_size, cos_sin_cache, head_dim, page_size, k_buffer, v_buffer, kv_cache_loc, is_neox, weight_q, weight_k, output_dtype,
    kv_cache_dtype, residual_q, residual_k, k_scale, v_scale, epsilon=1e-05) -> Tuple[Tensor, Tensor, Tensor]
  smoke_test: python3 -I -c "import lightop; assert hasattr(lightop,'split_qkv_rms_rotary_embedding_fuse_with_kv_store_quant')"
  role: competitor
