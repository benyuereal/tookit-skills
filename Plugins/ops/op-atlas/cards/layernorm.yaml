  conclusion: 带宽随 M 上升：M=1024 为 213 GB/s、M=8192 为 485 GB/s（后者达峰值 0.28）
  verified_on: '2026-11-23'
  next_probe:
    surface: fusion-boundary
    hypothesis: M=8192 档 485 GB/s 只有峰值的 0.28：若与上游 add 融合省一趟 HBM，应提到 0.5 以上
