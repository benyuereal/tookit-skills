id: layernorm
title: LayerNorm
family: norm
math: y = w*(x-mean(x))/sqrt(var(x)+eps) + b
status: measured
layer: kernel
op_card: null
impls:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: layernorm 融合
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 老模型 / 多模态
  not_for:
  - 只需 RMSNorm 时（多算一次均值）
  pros:
  - 融合族成熟
  cons:
  - 比 rmsnorm 多一次遍历
  source: references/libraries.md
  import_path: lightop.LayerNorm
  signature: LayerNorm(normalized_shape, eps=1e-5) 是 nn.Module
  smoke_test: python3 -I -c "import lightop; assert hasattr(lightop,"LayerNorm")"
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter 的 layernorm/norm 族
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - aiter 的 norm 族覆盖 LN，无需自研
  not_for:
  - 追求极限时不如专用实现
  pros:
  - 无外部依赖，适合做基线对照
  cons:
  - 无融合
  source: references/libraries.md
  import_path: aiter.layer_norm
  signature: layer_norm(input, weight, bias, eps)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import aiter\") ; assert hasattr(aiter,"layer_norm")"
