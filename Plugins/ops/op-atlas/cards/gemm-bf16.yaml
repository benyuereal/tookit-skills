id: gemm-bf16
title: BF16 GEMM（基础档）
family: gemm
math: out = A*B；A/B bf16，acc fp32
status: measured
layer: kernel
op_card: null
impls:
- repo: torch
  library_profile_ref: libraries.md §6
  file_hint: torch.mm / a @ b.t()
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 常规稠密 GEMM（M>=2048 时 0.78~0.87 达成率）
  not_for:
  - decode 小 M（<128，达 0.00~0.16，受访存限制）
  pros:
  - 比 F.linear 稳定快 8~10%（四个形状 mm/linear=0.900/0.911/0.920/0.956，同 kernel 只是 dispatch 选参差异）
  cons:
  - 小 M 带宽只到峰值的 0.30
  source: references/libraries.md
  import_path: torch.mm
  signature: 'torch.mm(a, b_t)  # b_t 为 [K,N]'
  smoke_test: python3 -I -c "import torch; a=torch.zeros(8,8); assert torch.mm(a,a).shape==(8,8)"
- repo: triton
  library_profile_ref: libraries.md §6
  file_hint: torch.mm 后端
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要精细 layout 控制的自定义 GEMM
  not_for:
  - 常规稠密 GEMM（用 torch.mm 更快，实测 8~10%）
  pros:
  - 少一层封装，直接调库
  cons:
  - gfx938 上 FP8 无方案
  source: references/libraries.md
  import_path: triton.jit
  signature: '@triton.jit 写 GEMM kernel'
  smoke_test: python3 -I -c "import triton; assert hasattr(triton,"jit")"
- repo: deepgemm
  library_profile_ref: libraries.md §6
  file_hint: fp8_gemm（走 hipBLASLt）
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - grouped 场景
  not_for:
  - 纯稠密
  pros:
  - 灵活但不如专用实现快
  cons:
  - 多一层
  source: references/libraries.md
  import_path: deepgemm.fp8_gemm
  signature: fp8_gemm(a,b,d,c=None,recipe=None)
  smoke_test: python3 -I -c "import deepgemm; assert hasattr(deepgemm,"fp8_gemm")"
ceiling:
  kind: roofline_model
  ref: Plugins/ops/skills/op-roofline/constants.yaml
  bound: mixed
  note: 拐点由两条地板交叉决定，随 N 移动：K=N=4096 时 M≈256，N=14336 时 M≈512。不能写固定阈值
shapes:
- decode-m1
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  kb_path: Plugins/ops/skills/op-optimize/cases/005-bf16-gemm-shape-crossover/README.md
  ratio:
    kind: utilization
    unit: ratio
    value: 0.9
    vs: 本机实测 bf16 峰值 279 TF 的达成率（M=4096，peak 口径，与分母同口径）
    scope:
      cards: 1
      in_len: M=4096
      out_len: N=K=4096
      warmup: hot
      note: M=1024/2048/4096 = 0.73/0.83/0.90（peak 口径）；同形状 steady 口径只有 0.58/0.74/0.74。峰值与稳态差 16%，引用必须带口径
  conclusion: M>=2048 达峰值 0.83~0.90；torch.mm 比 F.linear 跨 3 形状几何平均快 1.10x
  verified_on: '2026-11-23'
  geomean:
    value: 1.1
    vs: torch.mm 相对 F.linear 的加速比（同一 bf16 稠密 GEMM，三个 M 档）
    shapes:
    - M=1024
    - M=2048
    - M=4096
    coverage: 3/3
    gate: true
  evidence:
  - path: Plugins/ops/skills/op-optimize/cases/005-bf16-gemm-shape-crossover/results/gemm-crossover.json
    sha256: 5dbd0de69978f49ee4487a54f50c2e59f7f293de3c4d2de4d28d16e9084ad3ca
    verified_on: '2026-11-23'
  next_probe:
    surface: none
    none_reason: M>=2048 已 0.83~0.90，接近 achievable 上限；小 M 的 0.30 带宽是访存模式问题，需改 kernel，属 source-patch。
    hypothesis: M=1024 档 peak 口径 0.73、steady 0.58，若按 M 分档选不同 tile，应把 M=1024 提到 0.80 以上
    expected: M=1024 从 0.73 → ≥0.80
    stop_if: 若分档后仍 <0.78，说明 M=1024 已在下限（块数不足）⇒ 接受现状
    effort: 2h
    falsifier: 若本机出现比 hipBLASLt 更快的 bf16 GEMM 实现（当前 M>=2048 已达 0.83~0.90），或小 M 档的访存模式能被改写成合并读，则重新推进。
modify_path:
  kind: env-flag
  what: 走 hipBLASLt 的算法选择
  how: torch.mm 背后是 hipBLASLt，用 torch.backends 的 benchmark 模式允许它选算法
  requires: 形状固定（benchmark 模式首次会扫算法）
surfaces:
- occupancy
- split-k
