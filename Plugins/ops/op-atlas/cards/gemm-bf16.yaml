- repo: boltops
  library_profile_ref: libraries.md §10
  file_hint: matmul_persistent
  tier: fallback
  role: competitor
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - persistent 形态的 bf16 matmul
  not_for:
  - 需要 batched 的场景
