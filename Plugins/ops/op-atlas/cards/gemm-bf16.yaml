  library_profile_ref: libraries.md §6
  file_hint: torch.mm / a @ b.t()
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 常规稠密 GEMM（M>=2048 时 0.78~0.87 达成率）
  not_for:
  - 需要自定义 epilogue 的场景
  pros:
  - hipBLASLt/rocBLAS 成熟 kernel：实测 214.1 TF @4096³
