  cons:
  - 小 M 带宽只到峰值的 0.30
  source: references/libraries.md
  import_path: torch.mm
  signature: 'torch.mm(a, b_t)  # b_t 为 [K,N]'
  smoke_test: python3 -I -c "import torch; a=torch.zeros(8,8); assert torch.mm(a,a).shape==(8,8)"
  role: competitor
- repo: triton
  library_profile_ref: libraries.md §6
  file_hint: torch.mm 后端
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
