  not_for:
  - 常规稠密 GEMM（用 torch.mm 更快，实测 8~10%）
  pros:
  - 直接调 torch.mm，无额外封装层
  cons:
  - gfx938 上 FP8 无方案
  source: references/libraries.md
  import_path: triton.jit
  signature: '@triton.jit 写 GEMM kernel'
  smoke_test: python3 -I -c "import triton; assert hasattr(triton,"jit")"
