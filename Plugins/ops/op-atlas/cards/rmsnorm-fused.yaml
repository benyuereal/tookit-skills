id: rmsnorm-fused
title: 融合 RMSNorm（含残差）
family: elementwise
math: y = w * ((x + r) / sqrt(mean((x+r)^2, -1) + eps))
status: measured
layer: kernel
op_card: Plugins/ops/skills/op-rmsnorm-fused
impls:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: 融合 norm 族
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要融合残差（省一次 HBM 往返）
  - 绝大多数 decoder（残差 + norm 是逐层必经）
  not_for:
  - 单条无链算子（融合没有可省的往返）
  pros:
  - 融合族成熟
  cons:
  - 原地写残差的变体会污染多变体对比
  source: references/libraries.md
  import_path: lightop.RMSNormAdd
  signature: RMSNormAdd(normalized_shape:int, eps:float=1e-5, inplace:bool=False); forward(X, residual)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import lightop\") ; assert hasattr(lightop,"RMSNormAdd")"
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter 的 norm 族（对照用）
  tier: fallback
  law_ref: null
  best_for:
  - 注意：融合残差应走 lightop.RMSNormAdd；aiter 这条只作非融合对照
  not_for:
  - 追求极限时
  pros:
  - 无外部依赖，适合做基线对照
  cons:
  - 字节数多一次往返
  source: references/libraries.md
  import_path: aiter.layer_norm
  signature: layer_norm(input, weight, bias, eps)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import aiter\") ; assert hasattr(aiter,"layer_norm")"
ceiling:
  kind: roofline_model
  ref: Plugins/ops/skills/op-rmsnorm-fused/contract.yaml
  bound: bandwidth
  note: 字节数完全确定、无中间态；最适合校准带宽判据的算子
shapes:
- decode-m1
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  kb_path: null
  ratio:
    kind: throughput
    unit: GB/s
    value: 887
    vs: M=8192 档带宽（GB/s，相对 achievable 流式峰值 1724 为 0.51）
    scope:
      cards: 1
      in_len: M=8192
      out_len: H=4096
      warmup: hot
      note: bf16 融合残差；M=1024 时仅 322 GB/s，M=8192 时 887 GB/s
  conclusion: 带宽随 M 上升：M=1024 为 322 GB/s、M=8192 为 887 GB/s（后者达峰值 0.51）
  verified_on: '2026-11-23'
modify_path:
  kind: replace-call
  what: torch 分步换成 lightop 融合
  how: RMSNormAdd(H, eps).cuda()(x, residual) 替代 x+r 后两次 torch 调用
  requires: lightop 0.6.0；注意 inplace 参数会改写残差
hard_preconditions:
- statement: lightop.RMSNormAdd 是 nn.Module，需 .cuda().to(bf16) 后调用，forward(X, residual)
  check: python3 -I -c "import lightop,torch; m=lightop.RMSNormAdd(512,eps=1e-6).cuda().to(torch.bfloat16); m(torch.randn(8,512,dtype=torch.bfloat16,device='cuda'),torch.randn(8,512,dtype=torch.bfloat16,device='cuda'))"
soft_preconditions:
- 建议 hot 态
- M 小时固定开销占比高，报达成率须同时给 M
surfaces:
- layout-pack
- fusion-boundary
updated: '2026-11-22'
