  basis: triton 211~221 µs / tilelang 213 µs / lightop 197.4 µs，三者全部落在 1200~1380 GB/s，离 1:1 可达 1749~1801 还有 22~39%。瓶颈是「2读2写交织 + 行内归约」这个访存模式，不是某个框架写得差。
  falsifier: 换 in-place 写回或下游融合（减流量 25%+）可推翻；换 DSL 只值 3~10%，推不翻。
  note: '**impl_ceiling 不许封卡**——它只说明当前工具链，换 codegen 或减流量就可能突破。'
