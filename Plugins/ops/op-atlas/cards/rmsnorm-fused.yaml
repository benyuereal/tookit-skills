modify_path:
  kind: replace-call
  what: torch 分步换成 lightop 融合
  how: RMSNormAdd(H, eps).cuda()(x, residual) 替代 x+r 后两次 torch 调用
  requires: lightop 0.6.0；注意 inplace 参数会改写残差
hard_preconditions:
- statement: lightop.RMSNormAdd 是 nn.Module，需 .cuda().to(bf16) 后调用，forward(X, residual)
  check: python3 -I -c "import lightop,torch; m=lightop.RMSNormAdd(512,eps=1e-6).cuda().to(torch.bfloat16); m(torch.randn(8,512,dtype=torch.bfloat16,device='cuda'),torch.randn(8,512,dtype=torch.bfloat16,device='cuda'))"
soft_preconditions:
- 建议 hot 态
- M 小时固定开销占比高，报达成率须同时给 M
