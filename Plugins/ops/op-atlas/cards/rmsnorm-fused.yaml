  evidence:
  - path: Plugins/ops/skills/op-rmsnorm-fused/results/prefill-8k-vs-lightop.json
    sha256: 8fe64dbca242c8df4efcf761dd0a2729c155a92248af9b4938ab6fe381f58e75
    verified_on: '2026-11-23'
  geomean:
    value: 1.4496
    shapes:
    - decode-m1 (M=1)
    - decode-m32 (M=32)
    - prefill-8k (M=8192)
    coverage: |
      三形状实测（event_isolated，3 轮，全部 |Δ|>3MAD 显著）：
        decode-m1   0.0488ms  1.6944x  （慢 69%）
        decode-m32  0.0493ms  2.0131x  （慢 101%）
        prefill-8k  0.1789ms  0.8930x  （快 10.7%）
      geomean = 1.4496。
    vs: |
      **整体比 lightop 慢 45%。** 只有 prefill-8k 这一个档位占优。
      另两种自研变体在 decode 上同样劣于 lightop：
        fused-hip-reg      @decode-m1  1.8741x
        fused-3pass-triton @decode-m1  3.5400x
      说明这不是变体选错，是融合实现在小 batch 下的固有劣势
      （固定开销摊不开，lightop 的 kernel 启动/调度更轻）。
      **本卡当前不满足「比厂商库快」的目标，S 项不予 claim。**
  conclusion: 仅 prefill 档快于 lightop，decode 两档均更慢，整体 geomean>1 判定不通用
  next_probe:
    surface: none
    none_reason: 三条 memory 类攻击面已逐一实测：fusion-boundary 已在用（2读2写=268.4MB，与 lightop 等语义）；cross-lane-fold
      已证伪（分块两趟 186~283µs 全更慢）；num_warps 扫参已最优 4。剩余 19.8% 落在 structural 区间，唯一未试的是「降流量」——需下游融合把
      268.4MB 降到 201MB 以下，不在本算子范围内。⇒ 收敛于 at_floor：triton 融合单 kernel 保留（相对 torch 分步
      6.6x），但未超过 lightop（慢约 20%，见 ledger 2026-11-24 裁决）
    hypothesis: 若要再拿 ≥10%，只能减少 HBM 流量（下游融合或 in-place 写回），不能靠调参
