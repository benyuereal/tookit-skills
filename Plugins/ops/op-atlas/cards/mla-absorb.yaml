updated: '2026-11-22'
hard_preconditions:
- statement: sched_meta 绑定形状：每个 (B, KV) 组合必须重新调用 get_mla_metadata()，不能跨形状复用
  check: 复用会在 B 不同时 AssertionError；形状相同但序列长不同时会静默走错调度（同一形状实测 173 vs 407 GB/s，差 2.4 倍）
- statement: get_mla_metadata() 不接参数，返回 (meta, None)；head_dim_v 是第 5 个位置参数
  check: 按旧文档传 (cache_seqlens, num_heads) 得到 "must be of type FlashMLASchedMeta"
