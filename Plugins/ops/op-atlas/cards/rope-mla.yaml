  requires: MLA 系模型
hard_preconditions:
- statement: flash_mla dense decode 只支持 (d_qk=576,d_v=512) 或 (d_qk=512,d_v=512)
  check: '传 d_qk=128 → AssertionError: Dense decode supports (d_qk=576, d_v=512) or (d_qk=512, d_v=512)'
- statement: KV cache 必须是 paged 的 [npages*B, 64, 1, d_qk] 形态
  check: 见上；非 paged 会报 shape 不匹配
