id: fused-add-rmsnorm
title: 残差 + RMSNorm 融合（fused_add_rmsnorm）
family: norm
math: y = w*((x+r)/sqrt(mean((x+r)^2, -1)+eps))；残差先加再归一
status: measured
layer: kernel
op_card: Plugins/ops/skills/op-fused-add-rmsnorm
variants:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop.RMSNormAdd（同族：RMSNorm / RMSNormAddDropout / RMSNormAddDropoutBias）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要融合残差的 decoder 前 norm（逐层必经）
  - dropout 也要融合的训练路径（RMSNormAddDropout）
  not_for:
  - 单条无链算子（融合没有可省的往返）
  - 需要 eps 位置与参考实现严格一致时先核对（RMSNormAdd 的 eps 在 sqrt 内）
  pros:
  - 省一次 HBM 往返（3*M*H*2B vs 4*M*H*2B）
  - 同族覆盖 dropout / bias 变体，不必自研
  cons:
  - 原地写残差的变体会污染多变体对比，每个变体须喂独立副本
  source: references/libraries.md
  import_path: lightop.RMSNormAdd
  signature: RMSNormAdd(normalized_shape:int, eps:float=1e-5, inplace:bool=False);
    forward(X, residual)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import lightop\") ; assert
    hasattr(lightop,"RMSNormAdd")"
  role: competitor
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter 的 norm 族（非融合对照）
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 不融合残差的基线对照
  not_for:
  - 需要融合残差时（那是 lightop.RMSNormAdd 的场景）
  pros:
  - 统一 API，便于与 RoPE 串联（fused_qk_rmsnorm_rope）
  cons:
  - 不融合残差，字节数比融合版多一次往返
  source: references/libraries.md
  import_path: aiter.layer_norm
  signature: layer_norm(input, weight, bias, eps) —— 非融合对照，不含残差加法
  smoke_test: python3 -I -c "import aiter; assert hasattr(aiter,"layer_norm")"
  role: competitor
ceiling:
  kind: roofline_model
  ref: Plugins/ops/skills/op-fused-add-rmsnorm/contract.yaml
  bound: bandwidth
  note: 字节数完全确定（融合后 3*M*H*2B），分母无争议，是校准带宽判据的载体
shapes:
- decode-m1
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  bottleneck:
    bound: memory
    root_cause: |
      访存受限：三次全量读写（读 x、读 residual、读 weight、写 y）串行占满带宽，
      计算侧（平方和归约 + 逐元素乘）完全被访存掩盖。
      实测 TCC 未命中率 91.2%，数据基本全部来自 DRAM；LDS bank 冲突为 0，
      寄存器无溢出，说明既不是共享内存瓶颈也不是占用率不足。
    caliber: prefill-8k (M=8192, H=4096)，event_isolated
    evidence:
    - what: TCC_MISS 2,097,304 / (TCC_HIT 203,255 + TCC_MISS) = 91.2% 未命中
      kind: counters
      reproduce: |
        hipprof --pmc --pmc-type 3 python3 -I \
          Plugins/ops/skills/op-fused-add-rmsnorm/bench/ab.py \
          --shape prefill-8k --variants fa-rms-mr2 --base lightop-rmsnormadd \
          --rounds 2 --measure-mode event_isolated
        然后 python3 -I scripts/pmc.py <csv> --kernel fused_rms_mr_k
        结果：GRBM_COUNT 187,385；TCC_HIT 203,255；TCC_MISS 2,097,304
    - what: SQ_LDS_BANK_CONFLICT = 0，LDS 不是瓶颈
      kind: counters
      reproduce: 同上一次 PMC 采集，字段 SQ_LDS_BANK_CONFLICT 读数为 0
    - what: arch_vgpr = 52 / sgpr = 32 / scr = 0，无私有内存溢出
      kind: counters
      reproduce: 同上一次 PMC 采集，geometry 行读出 arch_vgpr=52、scr=0
    - what: 达成率 83.1%（1438 GB/s ÷ 1730 GB/s rw_2to1 档实测上限）
      kind: ratio
      reproduce: |
        python3 -I Plugins/ops/skills/op-fused-add-rmsnorm/bench/ab.py \
          --shape prefill-8k --variants fa-rms-mr2 --base lightop-rmsnormadd \
          --rounds 5 --measure-mode event_isolated
        等语义 201.3MB ÷ 140.0us = 1438 GB/s

  kb_path: null
  ratio:
    kind: utilization
    unit: ratio
    value: 0.831
    vs: 2_rw_2to1 档实测 1730 GB/s；3 趟 201.3MB ÷ 140.0µs = 1438 GB/s ⇒ 83.1%。对照 lightop.RMSNormAdd
      同形状 255.2µs → 140.0µs 快 1.82x
    scope:
      cards: 1
      concurrency: 1
      in_len: M=8192
      out_len: H=4096
      warmup: hot
      note: 等语义 3 读 1 写 201.3MB；event_isolated 5 轮，base 每轮重测
  conclusion: 自研寄存器驻留实现相对 lightop 快 1.82x（event_isolated 可 claim）
  verified_on: '2026-11-25'
  next_probe:
    surface: fusion-boundary
    hypothesis: 融合已 2.39x 且 M 越大收益越高：若把下游的量化也融进同一趟，应再省一趟写（3 趟 → 2 趟）
    expected: 相对当前再快 ≥1.3x
    stop_if: 若融合量化后精度超容差或 VGPR 溢出（实测 spill>0），说明这条已到边界 ⇒ 标 at_floor
