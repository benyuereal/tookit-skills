id: fused-add-rmsnorm
title: 残差 + RMSNorm 融合（fused_add_rmsnorm）
family: norm
math: y = w*((x+r)/sqrt(mean((x+r)^2, -1)+eps))；残差先加再归一
status: measured
layer: kernel
op_card: Plugins/ops/skills/op-fused-add-rmsnorm
impls:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop.RMSNormAdd（同族：RMSNorm / RMSNormAddDropout / RMSNormAddDropoutBias）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要融合残差的 decoder 前 norm（逐层必经）
  - dropout 也要融合的训练路径（RMSNormAddDropout）
  not_for:
  - 单条无链算子（融合没有可省的往返）
  - 需要 eps 位置与参考实现严格一致时先核对（RMSNormAdd 的 eps 在 sqrt 内）
  pros:
  - 省一次 HBM 往返（3*M*H*2B vs 4*M*H*2B）
  - 同族覆盖 dropout / bias 变体，不必自研
  cons:
  - 原地写残差的变体会污染多变体对比，每个变体须喂独立副本
  source: references/libraries.md
  import_path: lightop.RMSNormAdd
  signature: RMSNormAdd(normalized_shape:int, eps:float=1e-5, inplace:bool=False); forward(X, residual)
  smoke_test: python3 -I -c "import importlib,torch; exec(\"import lightop\") ; assert hasattr(lightop,"RMSNormAdd")"
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter 的 norm 族（非融合对照）
  tier: fallback
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 不融合残差的基线对照
  not_for:
  - 需要融合残差时（那是 lightop.RMSNormAdd 的场景）
  pros:
  - 统一 API，便于与 RoPE 串联（fused_qk_rmsnorm_rope）
  cons:
  - 不融合残差，字节数比融合版多一次往返
  source: references/libraries.md
  import_path: aiter.layer_norm
  signature: layer_norm(input, weight, bias, eps) —— 非融合对照，不含残差加法
  smoke_test: python3 -I -c "import aiter; assert hasattr(aiter,"layer_norm")"
ceiling:
  kind: roofline_model
  ref: Plugins/ops/skills/op-fused-add-rmsnorm/contract.yaml
  bound: bandwidth
  note: 字节数完全确定（融合后 3*M*H*2B），分母无争议，是校准带宽判据的载体
shapes:
- decode-m1
- decode-m32
- prefill-8k
last_verdict:
  status: measured
  kb_path: null
  ratio:
    kind: speedup
    unit: x
    value: 2.39
    vs: torch 分步（x+r → rms → 除）的耗时比（M=8192 档）
    scope:
      cards: 1
      in_len: M=8192
      out_len: H=4096
      warmup: hot
      note: bf16；M=1024 档为 1.70x，M=8192 档为 2.39x；融合带宽 862 GB/s
  conclusion: 融合比分步快 1.70x(M=1024)/2.39x(M=8192)；M 越大收益越高
  verified_on: '2026-11-23'
modify_path:
  kind: replace-call
  what: torch 分步换成 lightop.RMSNormAdd
  how: lightop.RMSNormAdd(H, eps)(x, residual)，一次 kernel 完成残差加法+归一
  requires: lightop 0.6.0
hard_preconditions:
- statement: lightop.RMSNormAdd 是 nn.Module，需 .cuda().to(bf16)；forward(X, residual)
  check: python3 -I -c "import lightop,torch; m=lightop.RMSNormAdd(512,eps=1e-6).cuda().to(torch.bfloat16); m(torch.randn(8,512,dtype=torch.bfloat16,device='cuda'),torch.randn(8,512,dtype=torch.bfloat16,device='cuda'))"
- statement: 分步实现必须用 fp32 算 rms，否则 bf16 累加误差大
  check: 对比 fused 与 split 的 max_abs（本卡实测相对误差中位数 1.6e-3）
- statement: lightop.RMSNormAdd 要求归一化维度 >= 64
  check: H=4/3/5 等小维度直接报 "cols >= 64 INTERNAL ASSERT FAILED"；由 opcheck robustness 的「未见过的 shape」当类自动探到（2026-11-23）
soft_preconditions:
- 建议 hot 态
- M 越大融合收益越高（1.70x → 2.39x），小 M 时固定开销占比高
surfaces:
- fusion-boundary
- layout-pack
- occupancy
updated: '2026-11-22'
