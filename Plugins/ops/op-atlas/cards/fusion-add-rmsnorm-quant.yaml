modify_path:
  kind: replace-call
  what: torch 分步（x+r → rmsnorm → 动态量化）换成单个 lightop 入口
  how: lightop.rms_norm_dynamic_per_token_quant(x, w, eps, torch.int8, residual, True)；只要 fp8 就用 rms_norm_per_token_fp8_quant(x, w, eps, 0, residual, False)
  requires: lightop 0.6.0；residual 若非 None 会被原地改写，调用方勿复用
hard_preconditions:
- statement: 入口必须真能 import 且属性存在，否则整卡不可用
  check: python3 -I -c "import lightop; [assert_ for _ in ()]; assert hasattr(lightop,'rms_norm_dynamic_per_token_quant') and hasattr(lightop,'rms_norm_per_token_quant') and hasattr(lightop,'rms_norm_per_token_fp8_quant')"
- statement: 该入口会原地改写 residual（即使 update_input=False），多变体必须各喂独立副本
  check: python3 -I -c "import torch,lightop; M,H=8,64; x=torch.randn(M,H,device='cuda',dtype=torch.bfloat16); r=torch.randn(M,H,device='cuda',dtype=torch.bfloat16); r0=r.clone(); lightop.rms_norm_per_token_quant(x.clone(),torch.ones(H,device='cuda',dtype=torch.bfloat16),1e-5,torch.int8,r,False);
    assert not torch.equal(r,r0)"
- statement: gemma 变体的权重语义是 (1+w)，Llama/Qwen 权重直接用会偏 ~0.99 rel_l2
  check: python3 -I -c "import torch,lightop; M,H=8,256; x=torch.randn(M,H,device='cuda',dtype=torch.bfloat16); r=torch.randn(M,H,device='cuda',dtype=torch.bfloat16); w=torch.randn(H,device='cuda',dtype=torch.bfloat16);
    o,s=lightop.gemma_rms_norm_per_token_fp8_quant(x,w,1e-5,0,r,False); h=(x.float()+r.float()); ref=h*torch.rsqrt(h.pow(2).mean(-1,keepdim=True)+1e-5)*w.float(); print(float((o.float()*s-ref).norm()/ref.norm()))"
soft_preconditions:
- 建议 hot 态；计时用 cuda_event，禁 time.time()
- 结论只在 M=1024/8192、H=4096、bf16 输入下测得；换 shape 或换 fp16 须重测
