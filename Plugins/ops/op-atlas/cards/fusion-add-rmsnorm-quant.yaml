id: fusion-add-rmsnorm-quant
title: 残差 + RMSNorm + 动态量化 三合一（add_rmsnorm_quant）
family: norm
math: out, res_out, scale = dyn_quant(w*((x+res)/sqrt(mean((x+res)^2,-1)+eps))); 残差先加再归一
status: measured
layer: kernel
op_card: null
semantics:
  formula: y_q, y_scale = quant(w*(x+r)/sqrt(mean((x+r)^2,-1)+eps)); residual 由 update_input 原地写回
  inputs:
  - x
  - residual
  - weight
  outputs:
  - y_q
  - y_scale
  traffic_passes:
    reads: 2
    writes: 2
    passes: 4
    source: 框架证据（sglang/lightop 生产代码）：`i_q, _scales = lo_rms_norm_dynamic_per_token_quant(...)` 返回 2 份。residual 不额外返回——signature 的 update_input=True 时原地改写输入。此前填 3 份（多算 residual_out）是错的
  mutates_inputs:
  - input (update_input=True 时原地写 residual)
variants:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/rmsnorm.py 的 rms_norm_dynamic_per_token_quant（同族 rms_norm_per_token_quant / rms_norm_per_token_fp8_quant）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - decoder 每层「残差加 + pre-norm + 转 INT8/FP8」一步做完
  - 需要 residual_out 与量化 scale 同时返回（下游 GEMM 直接用）
  not_for:
  - 不需要量化的路径（用 fused_add_rms_norm 即可，少一次写）
  - 想靠 update_input 省掉 residual_out 拷贝时（见 cons，实测仍会写 residual）
  pros:
  - 单 kernel 完成 add+norm+quant：实测 M=8192/H=4096 bf16 下 int8 档 0.2856 ms、fp8 档 0.1971 ms
  - residual 参数可省，退化后 rel_l2 0.0080 走纯 norm+quant，与 fusion-add-rmsnorm 的入口可组合
  cons:
  - update_input=False 时 residual 仍被原地改写（实测 r==x+r），只改 input 不改 residual —— 多变体对比必须各喂副本
  - gemma_rms_norm_per_token_fp8_quant 的权重语义是 (1+w)（实测 rel_l2 0.0265 vs 0.9905），与 torch RMSNorm 的 w 不同，替换时会静默偏 0.98
  source: references/libraries.md
  import_path: lightop.rms_norm_dynamic_per_token_quant
  signature: 'rms_norm_dynamic_per_token_quant(input: Tensor, weight: Tensor, epsilon: float, quant_dtype: torch.dtype, residual: Optional[Tensor]=None, update_input: bool=True, limit: float=-1.0) -> tuple[Tensor,
    Tensor]'
  smoke_test: python3 -I -c "import lightop,torch; o,s=lightop.rms_norm_dynamic_per_token_quant(torch.randn(64,512,device='cuda',dtype=torch.bfloat16),torch.randn(512,device='cuda',dtype=torch.bfloat16),1e-5,torch.int8,torch.randn(64,512,device='cuda',dtype=torch.bfloat16),True);
    assert o.dtype==torch.int8 and s.shape==(64,1)"
  source_ref: null
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/rmsnorm.py rms_norm_per_token_quant（int8 走 dynamic_per_token_quant，fp8 走 rms_norm_fp8_quant）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 一个入口覆盖 int8/fp8 两种量化 dtype（dtype 参数分派）
  not_for:
  - 需要 limit 与 fp8 同时用时（limit 只在 int8 档有效，fp8 档传 limit 会抛 ValueError）
  pros:
  - 实测 M=8192/H=4096 bf16 int8 档 0.2791 ms，略快于 dynamic_per_token_quant 的 0.2856 ms
  cons:
  - fp8 档 rel_l2 0.0261、int8 档 0.0075；dtype 分派是 Python 层 if，不是单 kernel 双精度
  source: references/libraries.md
  import_path: lightop.rms_norm_per_token_quant
  signature: 'rms_norm_per_token_quant(input: Tensor, weight: Tensor, epsilon: float=1e-05, dtype: torch.dtype=torch.int8, residual: Optional[Tensor]=None, update_input: bool=False, limit: float=-1.0) ->
    Tuple[Tensor, Tensor]'
  smoke_test: python3 -I -c "import lightop,torch; o,s=lightop.rms_norm_per_token_quant(torch.randn(8,256,device='cuda',dtype=torch.bfloat16),torch.randn(256,device='cuda',dtype=torch.bfloat16),1e-5,torch.int8,torch.randn(8,256,device='cuda',dtype=torch.bfloat16),False);
    assert o.shape==(8,256)"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/rmsnorm.py rms_norm_per_token_fp8_quant（fp8type 0=e4m3 / 1=e5m2）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 只出 FP8 的路径（fp8type 选 e4m3/e5m2）
  not_for:
  - 需要 INT8 时（那是 rms_norm_per_token_quant 的 int8 分支）
  pros:
  - 实测 M=8192/H=4096 bf16 档 0.1971 ms，是本卡最快的一条
  - fp8 输出 dtype 实测为 torch.float8_e4m3fn，可直接喂 GEMM
  cons:
  - 实测 rel_l2 0.0261（fp8 舍入），比 int8 档的 0.0075 大一个档
  - 无 limit 参数，DeepSeek 式 clamp 该卡不支持
  source: references/libraries.md
  import_path: lightop.rms_norm_per_token_fp8_quant
  signature: 'rms_norm_per_token_fp8_quant(input: Tensor, weight: Tensor, epsilon: float=1e-05, fp8type: int=0, residual: Optional[Tensor]=None, update_input: bool=False) -> tuple[Tensor, Tensor]'
  smoke_test: python3 -I -c "import lightop,torch; o,s=lightop.rms_norm_per_token_fp8_quant(torch.randn(8,256,device='cuda',dtype=torch.bfloat16),torch.randn(256,device='cuda',dtype=torch.bfloat16),1e-5,0,torch.randn(8,256,device='cuda',dtype=torch.bfloat16),False);
    assert o.dtype==torch.float8_e4m3fn"
  role: competitor
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter.rmsnorm2d_fwd_with_add_dynamicquant（out-of-place 五参；同族 rmsnorm2d_fwd_with_add 只做 add+norm）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 走 AITER 统一 API / 已在 vLLM-SGLang 生态里的接入
  not_for:
  - 需要 residual_out 与量化结果都返回时（它要求调用方预分配 out/res_out/scales 三个张量）
  pros:
  - 实测 M=8192/H=4096 bf16 档 0.2559 ms，比 lightop int8 的 0.2856 ms 快
  - res_out 实测等于 x+r（allclose atol=1e-2），语义与 lightop 一致
  cons:
  - 签名不可读（*args/**kwargs 包装），实际声明是 (out,input,input,residual_out,scales,weight,eps)，靠报错反推
  - rel_l2 0.0151，为 lightop int8 的 0.0075 的两倍
  source: references/libraries.md
  import_path: aiter.rmsnorm2d_fwd_with_add_dynamicquant
  signature: (pybind11, 签名不可读；实测声明 rmsnorm2d_fwd_with_add_dynamicquant(out, input, residual, residual_out, scales, weight, eps) -> None)
  smoke_test: python3 -I -c "import aiter,torch; M,H=64,512; o=torch.empty(M,H,device='cuda',dtype=torch.int8); r=torch.empty(M,H,device='cuda',dtype=torch.bfloat16); s=torch.empty(M,1,device='cuda'); aiter.rmsnorm2d_fwd_with_add_dynamicquant(o,torch.randn(M,H,device='cuda',dtype=torch.bfloat16),torch.randn(M,H,device='cuda',dtype=torch.bfloat16),r,s,torch.randn(H,device='cuda',dtype=torch.bfloat16),1e-5)"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/rmsnorm.py gemma_rms_norm_per_token_fp8_quant
  tier: reference
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - Gemma 系（权重语义为 1+w）的 add+norm+fp8
  not_for:
  - Llama/Qwen 系（w 会被多算一次 1，实测 rel_l2 0.9905 完全对不上）
  pros:
  - 与 rms_norm_per_token_fp8_quant 同签名，可原地替换
  cons:
  - 权重语义是 (1+w)：实测用 (x+r)/(1+w) 对才到 rel_l2 0.0265，用 w 是 0.9905——换模型族时会静默错
  source: references/libraries.md
  import_path: lightop.gemma_rms_norm_per_token_fp8_quant
  signature: 'gemma_rms_norm_per_token_fp8_quant(input: Tensor, weight: Tensor, epsilon: float=1e-05, fp8type: int=0, residual: Optional[Tensor]=None, update_input: bool=False) -> tuple[Tensor, Tensor]'
  smoke_test: python3 -I -c "import lightop,torch; o,s=lightop.gemma_rms_norm_per_token_fp8_quant(torch.randn(8,256,device='cuda',dtype=torch.bfloat16),torch.randn(256,device='cuda',dtype=torch.bfloat16),1e-5,0,torch.randn(8,256,device='cuda',dtype=torch.bfloat16),False);
    assert o.dtype==torch.float8_e4m3fn"
  role: competitor
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter.fused_allreduce_rmsnorm_quant（norm+通信+量化，非本卡的 add+norm+quant）
  tier: unavailable
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 多卡 allreduce 与 norm 融合（属 I5，不属本卡的单卡链）
  not_for:
  - 单卡 add+norm+quant（本卡场景）；且本机无 distributed 初始化时不可用
  pros:
  - 若多卡链路成立，理论上省一次 allreduce 往返（未实测）
  cons:
  - 本机实测不可用：torch.distributed 未初始化，直接调用报 "Expected a value of type 'int' for argument '_fa'"，_fa 是 communicator 句柄
  - 它不是 add+norm+quant 语义：签名为 (_fa, inp, res_inp, res_out, out, scale_out, w, eps, reg_ptr, reg_bytes, use_1stage)，**不含独立 add 输入**，是 norm+quant 叠在 allreduce 后
  source: references/libraries.md
  import_path: aiter.fused_allreduce_rmsnorm_quant
  signature: (pybind11, 签名不可读；底层声明 fused_allreduce_rmsnorm_quant(_fa:int, inp, res_inp, res_out, out, scale_out, w, eps, reg_ptr, reg_bytes, use_1stage) -> None)
  smoke_test: python3 -I -c "import aiter; assert hasattr(aiter,'fused_allreduce_rmsnorm_quant')"
  role: unverified
