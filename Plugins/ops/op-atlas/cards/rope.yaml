modify_path:
  kind: replace-call
  what: 选对 rotate_style 并合入 norm
  how: aiter.RoPE.forward(x, freqs, rotate_style=0/1, ...)；若有前置 norm 用 fused_qk_rmsnorm_rope
  requires: freqs 形状 [B,S,1,D/2]（实测：写成 [B,S,D/2] 会报维度错）
hard_preconditions:
- statement: aiter.rope_fwd 的 freqs 必须是 [B,S,1,D/2]，写成 [B,S,D/2] 会报维度错
  check: 'python3 -I -c "from aiter.ops.rope import rope_fwd; import torch; x=torch.randn(2,8,4,64,dtype=torch.bfloat16,device=''cuda''); f=torch.rand(2,8,32,dtype=torch.float32,device=''cuda''); rope_fwd(x,f,0,False,False)"
    → RuntimeError: Dimension out of range'
- statement: aiter.RoPE 是 autograd Function 类，不能直接实例化调用
  check: 用 aiter.ops.rope.rope_fwd 而非 aiter.RoPE(...)
soft_preconditions:
- 建议 hot 态且 ≥9 轮
- bandwidth 分母按读 x + 写 y = 2*B*S*H*D*2B
