id: quant-per-token
title: per-token 动态量化（激活动态量化）
family: quant
math: scale[m] = amax(x[m,:])/QMAX；q[m,:] = round(x[m,:]/scale[m])
status: draft
layer: kernel
op_card: null
variants:
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop 的量化融合族（per-token / per-block）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - FP8 GEMM 的激活侧预处理（所有 FP8 路径的前置步骤）
  - 需要与上游算子融合（省一次 HBM 往返）
  not_for:
  - 权重静态量化（那是 prepack，一次性的）
