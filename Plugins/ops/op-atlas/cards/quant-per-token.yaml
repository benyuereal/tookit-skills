  role: competitor
  traffic_passes:
    reads: 2
    writes: 2
    passes: 4
    source: 融合版（含上游激活）按读 input [M,2H] + 读 weight/参数、写 q 与 scale 计；纯量化段口径见 aiter.per_token_quant_hip
  note: "bench 时注意两条口径不同：lightop 版含上游 silu_mul（多读一份 input），aiter 版是纯量化（1 读 1 写）；两者不可直接同榜算加速比"
