modify_path:
  kind: replace-call
  what: 换 grouped 路径入口
  how: 按 token 组织方式在 m_grouped_bf16_gemm_nt_masked 与 _contiguous 之间选
  requires: deepgemm 2.1.0
hard_preconditions:
- statement: masked 形态要求 N 被 256 整除（I=1408 被拒）
  check: '传 N=1408 → ValueError: N must be divisible by 256'
- statement: a/b 必须 3D [E,M,K] / [E,N,K]（2D 会 IndexError）
  check: '传 2D → IndexError: Dimension out of range'
- statement: mode=2000 系列需先 pack_bf16_masked_weight；mode=1000 只做 contiguous
  check: '不 pack 用 mode=2000 → ValueError: require pre-packed weights'
soft_preconditions:
- 建议 hot 态
- N 非 256 倍数时该路径不可用，需换实现
