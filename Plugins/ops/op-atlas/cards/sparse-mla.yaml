id: sparse-mla
title: 稀疏 MLA 前向（DSA 长上下文注意力）
family: attention
math: out[i,:] = Σ_{j∈TopK(i)} softmax(q_i·k_j)·v_j；索引 j 来自稀疏块生成器
status: tuned
layer: kernel
op_card: Plugins/ops/skills/op-sparse-mla
impls:
- repo: tilelang
  library_profile_ref: libraries.md §8
  file_hint: tilelang / tilelang-prefetch
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q1
  best_for:
  - ctx>=128k 长上下文
  - GLM5.3 tail_dim=0 / d=512 形状
  not_for:
  - 极短 ctx（launch 开销主导）
  - 需要绕开 DSL 布局税时
  pros:
  - 官方实现可读可改
  - 长上下文优先调优
  cons:
  - 每条 MMA 摊到的搬运指令是手写的 3-4 倍
  - 改源码不生效（内核缓存）
  source: references/libraries.md
  import_path: tilelang.jit
  signature: '@tilelang.jit'
  smoke_test: python3 -I -c "import tilelang; assert hasattr(tilelang,"jit")"
- repo: flash-mla
  library_profile_ref: libraries.md §7
  file_hint: flash_mla
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q1
  best_for:
  - ctx~8k 且 S>=128
  - GLM5.3 prefill S=4096
  not_for:
  - 小 M 且 KV 极短
  - 需要新的 attention 变体语义
  pros:
  - prefill 快
  - 与 vLLM/SGLang 路径天然集成
  cons:
  - 会原地改写 indices（多变体对比须各喂副本）
  source: references/libraries.md
  import_path: boltops.mla.flash_mla_sparse_fwd
  signature: flash_mla_sparse_fwd(...)
  smoke_test: python3 -I -c "import boltops; assert hasattr(importlib.import_module("boltops.mla"),"flash_mla_sparse_fwd")"
- repo: in-house
  library_profile_ref: null
  file_hint: hip-glm（手写主循环，绕开 tilelang 布局转换）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要绕开布局转换的特殊形状
  not_for:
  - 常规形状（不如现成实现）
  pros:
  - 完全可控，但需自行维护
  cons:
  - 现成库不支持：tilelang 版的布局转换税（每条 MMA 摊到的搬运指令是手写的 3-4 倍），绕开它只能手写主循环
  source: references/libraries.md
  source_ref:
    path: null
    symbol: null
    line: null
    build_cmd: null
    note: 手写主循环（hip-glm）的源码在 op-sparse-mla/dev/ 下
  l1_exempt_reason: 手写主循环（hip-glm）是绕开 tilelang 布局税的定制实现，源码在 op-sparse-mla/dev/ 下，不在任何库里
ceiling:
  kind: roofline_model
  ref: Plugins/ops/skills/op-roofline/models/sparse_mla.py
  model_name: sparse_mla
  bound: mixed
  note: 绑定约束是依赖链/并发；内存地板仅占实测 39%、算力 23%
shapes:
- decode-s128
- decode-m1
- decode-m32
- prefill-8k
- prefill-320k
- decode-glm53
last_verdict:
  status: measured
  kb_path: ~/.config/dcu-toolkit/kb/op-opt/sparse-mla-20261027.md
  ratio:
    kind: utilization
    unit: ratio
    value: 0.94
    vs: achievable 流式峰值（mem-only 变体达成率）
    scope:
      cards: 1
      in_len: ctx 32k-320k
      out_len: S=128
      warmup: hot
      note: mem-only 变体，非整 kernel
  conclusion: 已收敛到指令数地板而非带宽地板；32k 档约 1.7 倍差是 REPLICATE_H 结构税
  verified_on: '2026-10-29'
  next_probe:
    surface: none
    none_reason: 已收敛到指令数地板而非带宽地板；32k 档的 1.7x 差是 REPLICATE_H 的结构税，消除它需 bm64，而 bm64/thr256 必然溢出（实测 spill 30，慢 2.12x）。
    hypothesis: 若能把非 acc_o 寄存器从 ~190 压到 ~100，bm64 应不再溢出并消掉 32k 档的 1.7x 税
    expected: 32k 档从 1.7x 差降到 ≤1.2x
    stop_if: 若压寄存器需 spill>0 或额外 LDS，说明 bm64 这条路在本机走不通 ⇒ 保持 tuned，不再追 at_floor
    effort: 8h
    falsifier: 若非 acc_o 寄存器能从 ~190 压到 ~100 使 bm64 不溢出（当前 bm64/thr256 实测 spill 30、慢 2.12×），则重新推进。
modify_path:
  kind: env-flag
  what: 切 tilelang 的 persistent 后端与 page 分组
  how: 设 LIGHTOP_PAGED_MQA_LOGITS_BACKEND=1 与 LIGHTOP_PAGED_MQA_LOGITS_GROUP_SIZE=3；FP8 路径必须保持 0
  requires: lightop 0.6.0 且非 FP8（FP8+persistent 会变慢/崩）
surfaces:
- gather-path
- occupancy
- layout-pack
