modify_path:
  kind: replace-call
  what: varlen 换固定长度（消除变长调度开销）
  how: 形状固定时用 flash_attn_func 替代 flash_attn_varlen_func，省掉 cu_seqlens 的间接寻址
  requires: batch 内序列等长
hard_preconditions:
- statement: flash_attn 输入必须是 [B,S,H,D]，D 需在支持范围（128 可用）
