last_verdict:
  status: measured
  kb_path: null
  ratio:
    kind: speedup
    unit: x
    value: 1.66
    vs: causal 相对 non-causal 的耗时比（1.780/2.961）
    scope:
      cards: 1
      in_len: S=2048
      out_len: 同长
      warmup: hot
      note: B=8 H=32 D=128 bf16；非加速比，是两种 mask 形态的差距
  conclusion: causal 相对 non-causal 耗时比为 0.60；两条路径 TFLOPS 均远低于 bf16 峰值
  verified_on: '2026-11-23'
  next_probe:
    surface: none
    none_reason: 本卡的结论是「causal 相对 non-causal 的耗时比 0.60」，属于对照实验性质，不是可优化的实现。可优化对象是 mha-prefill 与 paged-attention-decode。
    hypothesis: causal 工作量减半但耗时只降到 0.60，若块跳过完全有效应到 0.50；差的 0.10 应来自三角边界的半块
    expected: 修复半块浪费后耗时比 → 0.52
    stop_if: 若做不到 0.55 以下，说明 flash_attn 的 causal 分块粒度已定型 ⇒ 接受，不改
    effort: 2h
    falsifier: 若 flash_attn 支持自定义 causal 分块粒度（当前 0.60 的耗时比来自半块浪费），或出现能利用三角边界的实现，则重新推进。
  regimes:
    prefill:
      m: 8192
      kind: speedup
      value: 1.66
      bound: compute
      note: causal 相对 non-causal
    decode:
      m: 1
      kind: bandwidth
      value: null
      bound: memory
      note: 未测定
      denominator:
        value: 1848
        source: bw-ladder.yaml 2_read_only
