modify_path:
  kind: replace-call
  what: 换掉 flash_attn 的 decode 路径
  how: 本机 decode 需换实现（flash_mla 吸收式达 0.35）；调参数无效——SQ 从 1 到 32 耗时不变，说明固定代价不由 query 数决定
  requires: MLA 类模型可走 flash_mla；标准 MHA 的替代实现本轮未跑通（boltops 未测定）
hard_preconditions:
- statement: paged 的 block_size 必须被 64 整除
  check: 16/32 直接报 "Paged KV cache block size must be divisible by 64"（文案写 gfx936，实机 gfx938）
- statement: q 必须是 (B, S, H, D) 布局；decode 时 S=1
  check: 传 (B, H, S, D) 会静默算错形状或 assert
