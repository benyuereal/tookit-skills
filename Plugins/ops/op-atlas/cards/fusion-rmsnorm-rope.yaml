id: fusion-rmsnorm-rope
title: RMSNorm + RoPE 融合（rmsnorm_rope）
family: rope
math: q,k = rope(rmsnorm(q,k)*w)；norm 在 sqrt 内加 eps，rope 用 cos_sin_cache
status: measured
layer: kernel
op_card: null
semantics:
  formula: "q_out, k_out = rope(rmsnorm(q)*w_q), rope(rmsnorm(k)*w_k)"
  inputs: [q, k, w_q, w_k, cos_sin_cache, positions]
  outputs: [q_out, k_out]
  traffic_passes:
    reads: 2
    writes: 2
    source: 读 q+k 与权重/cache（cache 为小表）；写 q_out+k_out。融合省的是「norm 输出再读一次」的中间态往返
  mutates_inputs: [q, k]
variants:
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter/ops/fused_rmsnorm_rope.py fused_qk_rmsnorm_rope（同文件 fused_rmsnorm_rope_op 只处理单张量）
  tier: primary
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - decoder 的 QK-norm + RoPE 一步做完（单 kernel launch）
  - head_dim 固定 128 的主流模型（Llama/Qwen/Gemma 系）
  not_for:
  - head_dim≠128（实测硬报 "only supports head_dim 128 for now"）
  - freqs 非 fp32（实测硬报 "only supports freqs fp32 for now"）
  pros:
  - 单次调用完成 Q/K 两路 norm+rope：实测 B=1/S=2048/NH=32/D=128 bf16 下 0.0920 ms
  - 数值可对：与手写 fp32 oracle 的 q rel_l2 0.00166（freqs 用 interleaved 布局）
  cons:
  - 只吃 4D [B,S,H,D]：2D [T,H*D] 直接报 "q and k must be 4D"
  - head_dim 只支持 128、freqs 只支持 fp32 —— 两条硬约束都是运行期报错，不是文档声明
  - 融合用的是 interleaved 布局（[cos,sin] 交错），不是 neox 的 [cos|sin]，喂错 cache 不报错只偏（实测 rel_l2 0.90）
  source: references/libraries.md
  import_path: aiter.fused_qk_rmsnorm_rope
  signature: "fused_qk_rmsnorm_rope(q: Tensor, k: Tensor, q_weight: Tensor, k_weight: Tensor, freqs: Tensor, eps: float=1e-06) -> Tuple[Tensor, Tensor]"
  smoke_test: python3 -I -c "import aiter,torch; B,S,H,D=1,8,4,128; q=torch.randn(B,S,H,D,device='cuda',dtype=torch.bfloat16); f=torch.randn(S,D,device='cuda'); assert aiter.fused_qk_rmsnorm_rope(q,q,torch.ones(D,device='cuda',dtype=torch.bfloat16),torch.ones(D,device='cuda',dtype=torch.bfloat16),f,1e-6)[0].shape==q.shape"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/fuse_rmsnorm_rope.py rms_rotary_embedding_fuse
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 需要 neox / interleaved 两种 rotate 布局可选的路径（is_neox 参数）
  - 支持 residual_q/residual_k 的先加后归一
  not_for:
  - 需要 out-of-place 输出时（它原地改写 query/key 并返回同一引用）
  pros:
  - 支持 2D [T,H*D] 与 3D [T,H,D] 两种布局（实测都通过）
  - cos_sin_cache 可用 bf16（实测 bf16 cache 正常；fp32 cache 直接报 "expected scalar type BFloat16 but found Float"）
  - 数值可对：neox/interleaved 两种布局各对到 rel_l2 0.0026-0.0030
  cons:
  - 原地改写 query/key：多变体对比必须各喂副本
  - cos_sin_cache 的 dtype 必须与 q/k 一致，fp32 cache 不报「dtype 不匹配」而报 "expected scalar type BFloat16 but found Float"
  - head_size 是独立参数，2D 输入时需自己保证 H*D 可整除
  source: references/libraries.md
  import_path: lightop.rms_rotary_embedding_fuse
  signature: "rms_rotary_embedding_fuse(positions: Tensor, query: Tensor, key: Optional[Tensor], head_size: int, cos_sin_cache: Tensor, is_neox: bool, weight_q: Tensor, weight_k: Tensor, residual_q: Optional[Tensor], residual_k: Optional[Tensor], epsilon: float=1e-05) -> Tuple[Tensor, Optional[Tensor]]"
  smoke_test: python3 -I -c "import lightop,torch; T,H,D=8,4,64; q=torch.randn(T,H*D,device='cuda',dtype=torch.bfloat16); cs=torch.randn(64,D,device='cuda',dtype=torch.bfloat16); w=torch.ones(D,device='cuda',dtype=torch.bfloat16); o=lightop.rms_rotary_embedding_fuse(torch.arange(T,device='cuda'),q,q,D,cs,False,w,w,None,None,1e-5); assert o[0].shape==q.shape"
  role: competitor
- repo: lightop
  library_profile_ref: libraries.md §3
  file_hint: lightop/rmsnorm.py fused_rms_norm_rope_contiguous（MLA 专用：q_pe/k_pe 只转 rope 段，kv_c 只做 norm）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - MLA 的 q/kv 拆分布局：q_c 与 kv_c 只 norm 不转、q_pe/k_pe 只转不 norm
  - 需要同时把 kv_c_normed 写进 paged kv_cache 的链路
  not_for:
  - 普通 MHA/GQA 的「整条 head 做 norm+rope」（那是 rms_rotary_embedding_fuse）
  pros:
  - 一次调用同时产出 q_pe/k_pe 的 rope、kv_c 的 norm、kv_c_normed、以及 kv_cache 写入
  - 数值可对：q_rope rel 0.00207、k_rope 0.00212、kv_c_normed rel 0.00166（对 fp32 oracle）
  cons:
  - 不是「norm+rope」同语义：kv_c 只做 rmsnorm 不做 rope，q_c 完全不碰——是 MLA 的三段异构布局
  - 契约极窄：q_stride_head 必须等于 q_c_dim+rot_dim，kv_c.stride(0) 必须等于 k_pe.stride(0)，否则直接报错
  - 参数 17 个，靠报错和上游测试反推 (kv_c 需与 k_pe 共享 strided 视图)
  source: references/libraries.md
  import_path: lightop.fused_rms_norm_rope_contiguous
  signature: "fused_rms_norm_rope_contiguous(positions, q_pe, k_pe, kv_c, kv_c_normed, weight, cos_sin_cache, slot_mapping, kv_cache, kv_cache_dtype_str, kv_cache_scale, is_neox_style=False, epsilon=1e-05, limit=-1.0, flashmla_fp8_layout=False, kv_quant_epsilon=1e-06, kv_smooth_scale=None) -> None"
  smoke_test: python3 -I -c "import lightop; assert hasattr(lightop,'fused_rms_norm_rope_contiguous')"
  role: competitor
- repo: aiter
  library_profile_ref: libraries.md §4
  file_hint: aiter.fused_rmsnorm_rope_op（单张量版，只 norm+rope 一个 tensor）
  tier: structural
  law_ref: Plugins/ops/skills/op-roofline/references/pipeline.md#Q4
  best_for:
  - 只处理 Q 一路（K 缺失或另一路走别的入口）
  not_for:
  - 需要 Q/K 两路同 launch（那是 fused_qk_rmsnorm_rope）
  pros:
  - 函数式、out-of-place 返回单个张量（不像 lightop 原地改写）
  cons:
  - 同样只支持 4D、head_dim=128、freqs fp32；实测 q 对 interleaved oracle rel 0.00166
  - 只做单张量，Q/K 两路要调两次 = 两次 launch，「融合」只在一路内成立
  source: references/libraries.md
  import_path: aiter.fused_rmsnorm_rope_op
  signature: "fused_rmsnorm_rope_op(input: Tensor, input_weight: Tensor, freqs: Tensor, eps: float=1e-06) -> Tensor"
  smoke_test: python3 -I -c "import aiter,torch; B,S,H,D=1,8,4,128; x=torch.randn(B,S,H,D,device='cuda',dtype=torch.bfloat16); f=torch.randn(S,D,device='cuda'); assert aiter.fused_rmsnorm_rope_op(x,torch.ones(D,device='cuda',dtype=torch.bfloat16),f,1e-6).shape==x.shape"
  role: competitor
ceiling:
  kind: constants
  ref: Plugins/ops/skills/op-roofline/constants.yaml#memory.stream_read_peak
  bound: bandwidth
  note: 2R2W 的 memory-bound 链；分母 stream_read_peak=1724 GB/s（status unverified，须并列实测）
shapes:
- decode-m1
- prefill-8k
last_verdict:
  status: measured
  kb_path: null
  ratio:
    kind: speedup
    unit: x
    value: 1.86
    vs: aiter 融合档相对「2×rmsnorm2d_fwd 单做 norm」的耗时比（S=2048；S=8192 档为 1.82x）——不是相对完整分步，rope 段未计入
    scope:
      cards: 1
      in_len: S=2048 与 S=8192
      out_len: NH=32 D=128
      warmup: hot
      note: bf16 4D 输入；cuda_event；预克隆池 16 组轮换。融合 0.1077 ms vs 仅 norm 0.2093 ms（S=2048）
  conclusion: 融合档比单做 2 次 norm 还快 1.86x(S=2048)/1.82x(S=8192)；rope 段另计
  verified_on: '2026-11-23'
  traffic_passes:
    reads: 2
    writes: 2
  inputs: [q, k, w_q, w_k, cos_sin_cache, positions]
  outputs: [q_out, k_out]
  baseline_count: 1
  single_source: true
  comparison:
    baseline: split 2x rmsnorm2d_fwd
    baseline_role: competitor
    semantics_aligned: false
    alignment: "不可比：融合档含 rope，split 参考只做 norm，少一段计算。此处仅用来说明「融合档比单做 norm 还快」，不构成加速比结论"
    cand_us: 107.7
    base_us: 209.3
    ratio: 1.943
    significant: true
  next_probe:
    surface: occupancy
    hypothesis: head_dim 只支持 128、freqs 只支持 fp32，且 B=1/S=2048/NH=32 时读 67MB 数量级；若把 freqs 预取进 LDS 并把 4D 摊平成 2D 发射，占用率应还能提 20% 以上
    expected: 相对当前 ≥1.2x
    stop_if: 若摊平后不涨，说明瓶颈在 rms 的跨 lane 归约而非发射形状、扩容无用 ⇒ 说明已到 impl_ceiling
    effort: 4h
modify_path:
  kind: replace-call
  what: rmsnorm 后再调 rope 两段换成 aiter.fused_qk_rmsnorm_rope
  how: aiter.fused_qk_rmsnorm_rope(q4d, k4d, q_w, k_w, freqs_interleaved_fp32, eps) 一次出两路；非 128 head_dim 或非 4D 布局改用 lightop.rms_rotary_embedding_fuse
  requires: aiter 侧 head_dim==128、freqs 为 fp32 且按 interleaved [cos,sin] 交错布局
hard_preconditions:
- statement: aiter 入口硬约束 head_dim=128、freqs fp32、输入 4D [B,S,H,D]
  check: python3 -I -c "import aiter,torch; B,S,H,D=1,8,4,128; q=torch.randn(B,S,H,D,device='cuda',dtype=torch.bfloat16); f=torch.randn(S,D,device='cuda',dtype=torch.float32); aiter.fused_qk_rmsnorm_rope(q,q,torch.ones(D,device='cuda',dtype=torch.bfloat16),torch.ones(D,device='cuda',dtype=torch.bfloat16),f,1e-6)"
- statement: freqs 必须是 interleaved 布局（[cos0,sin0,cos1,sin1...]），neox 的 [cos|sin] 不报错但语义错
  check: python3 -I -c "import torch,aiter; B,S,H,D=1,4,2,128; q=torch.randn(B,S,H,D,device='cuda',dtype=torch.bfloat16); w=torch.ones(D,device='cuda',dtype=torch.bfloat16); f=torch.cat([torch.ones(S,D//2,device='cuda'),torch.zeros(S,D//2,device='cuda')],-1); o=aiter.fused_qk_rmsnorm_rope(q,q,w,w,f,1e-6)[0]; ref=q.float()*torch.rsqrt(q.float().pow(2).mean(-1,keepdim=True)+1e-6); print(float((o.float()-ref).norm()/ref.norm()))"
- statement: lightop.rms_rotary_embedding_fuse 原地改写 query/key，且 cos_sin_cache dtype 必须与 q/k 一致
  check: python3 -I -c "import lightop,torch; T,H,D=8,4,64; q=torch.randn(T,H*D,device='cuda',dtype=torch.bfloat16); q0=q.clone(); cs=torch.randn(64,D,device='cuda',dtype=torch.bfloat16); lightop.rms_rotary_embedding_fuse(torch.arange(T,device='cuda'),q,q,D,cs,False,torch.ones(D,device='cuda',dtype=torch.bfloat16),torch.ones(D,device='cuda',dtype=torch.bfloat16),None,None,1e-5); assert not torch.equal(q,q0)"
soft_preconditions:
- hot 态；cuda_event 计时
- 只测了 B=1、NH=32、D=128、bf16；其他 head_dim 须先确认支持面
surfaces:
