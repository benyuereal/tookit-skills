name: ci

# 存在理由：仓库原有的 .gitlab-ci.yml 是内网 Kits Platform 父/子流水线
# （include tsoc/kits-platform/kits-common），且 sanitize-gate 只在 open-source
# 分支跑 —— 在 GitHub 上等于零检查。本文件提供与内网无关的最小可用门禁。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: sanitize + evals + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. 脱敏规则自测：规则表本身坏了必须立刻发现，否则 gate 是假绿
      - name: sanitize selftest
        run: python3 sanitize.py --selftest

      # 2. 全仓脱敏扫描：exit 非 0 表示有内部残留（文档/邮箱/内网地址/设备号）
      - name: sanitize scan
        run: python3 sanitize.py .

      # 3. 静态 evals：skill 描述与 evals 契约
      - name: static evals
        run: python3 scripts/run_evals.py --root .

      # 3b. 算子图谱防漂移（索引与 cards 双向一致、§/L 号可解析、字段白名单）
      - name: op-atlas validate
        run: python3 -I Plugins/ops/op-atlas/validate.py --atlas Plugins/ops/op-atlas

      - name: eval_rate / geomean 自检
        run: |
          python3 -I scripts/evalrate.py --selftest
          python3 -I scripts/geomean.py --selftest

      - name: op-atlas INDEX 与卡片同步
        # INDEX 是生成物。手改了卡片没跑 sync_index.py，这里红。
        run: python3 -I Plugins/ops/op-atlas/sync_index.py --check

      # 4. ops 域单测（含 engine 的显著性、三道门、loop 状态机）
      #
      # 用 pytest 而不是 unittest discover：后者在 Plugins/ops/tests 下
      # 会输出 "Ran 0 tests ... OK"（空跑），CI 因此一直是假绿。
      # 实测同一目录 pytest 能收集到 350 个用例。
      # importmode 固定在 pytest.ini 里，不要删——多个卡都有同名
      # _common.py / test_adapter.py，默认模式会互相覆盖。
      - name: ops tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q

      # 5. 结构 lint：基线已入库，这里**硬依赖**它。
      #    早先写成「基线不存在就跳过」，等于给自己留了一个静默关掉门禁的开关。
      - name: structure lint (新增违规为 0)
        run: |
          test -f lint-baseline.json || { echo "::error::lint-baseline.json 缺失——门禁不能静默跳过"; exit 1; }
          python3 skill_lint.py --root . --baseline lint-baseline.json --out /tmp/lint-now.json
